name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # GitHub 의 ubuntu 러너에는 Android SDK 가 이미 설치돼 있음 (ANDROID_HOME).
      # 부족한 SDK 구성요소는 Gradle(Android 플러그인)이 알아서 내려받는다.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoClean-apk
          path: app/build/outputs/apk/debug/app-debug.apk
