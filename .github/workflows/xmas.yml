name: Build Christmas Tree APK

# 크리스마스 트리(WebView) 앱 전용 빌드.
# PhotoClean 빌드(build.yml)와 완전히 분리 — christmas-tree/ 폴더 변경 때만 돈다.
on:
  push:
    branches: [ "ccr-a66dfdf5-secynu" ]
    paths:
      - "christmas-tree/**"
      - ".github/workflows/xmas.yml"
  workflow_dispatch:

permissions:
  contents: write   # 릴리즈에 apk 올리기

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: christmas-tree
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # GitHub ubuntu 러너에는 Android SDK 가 이미 설치돼 있음.
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk "ChristmasTree-1.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ChristmasTree-apk
          path: christmas-tree/ChristmasTree-1.${{ github.run_number }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "xmas-v1.${{ github.run_number }}" \
            "ChristmasTree-1.${{ github.run_number }}.apk" \
            --title "크리스마스 트리 v1.${{ github.run_number }}" \
            --notes "글자로 피어나는 크리스마스 트리 (WebView 앱). 내려받아 설치 후 바로 실행하세요. 알 수 없는 출처 설치 허용이 필요할 수 있어요." \
            --target "$GITHUB_SHA" \
            --latest=false
