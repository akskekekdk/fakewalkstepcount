<title>글자 크리스마스 트리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Fullscreen night-sky canvas: letters assemble into a slowly rotating tree + 2 face baubles, with falling gifts and a santa hat. Committed dark world. */
  :root{
    --bg:#070b18; --bg2:#04060e; --ink:#e8eefc; --muted:#8fa0c4;
    --gold:#e8b84b; --panel:rgba(10,15,30,.72); --line:rgba(255,255,255,.14);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;
    background:radial-gradient(120% 90% at 50% 16%,#0d1430 0%,var(--bg) 45%,var(--bg2) 100%);
    color:var(--ink); font-family:"Space Grotesk",system-ui,sans-serif; overflow:hidden;
    -webkit-tap-highlight-color:transparent;}
  #stage{position:fixed; inset:0}
  canvas{display:block; width:100%; height:100%}
  .hud{position:fixed; top:env(safe-area-inset-top,0); left:0;
    padding:14px 0 0 max(16px,env(safe-area-inset-left,0px));
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; line-height:1.55;
    color:var(--muted); pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.6); z-index:4}
  .hud b{color:#cdd8f3; font-weight:500; font-variant-numeric:tabular-nums}
  .filebar{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    text-align:center; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--muted);
    pointer-events:none; z-index:4; letter-spacing:.3px}
  .filebar .dot{color:#3ddc84}
  .banner{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
    display:flex; justify-content:center; z-index:4; pointer-events:none;
    padding:0 max(16px,env(safe-area-inset-left,0px))}
  .words{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .word{display:flex; gap:5px}
  .word span{font-weight:700; font-size:clamp(14px,4.6vw,22px); letter-spacing:2px;
    width:1.5em; height:1.5em; display:grid; place-items:center; border-radius:6px;
    background:rgba(255,255,255,.05); color:#dfe7fb;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 3px 12px rgba(0,0,0,.4)}
  .word.g span{background:linear-gradient(180deg,#1f7d3f,#14532a); color:#dff6e6}
  .word.r span{background:linear-gradient(180deg,#b23a3a,#7a2626); color:#ffe4e1}
  .word.y span{background:linear-gradient(180deg,#d8a93f,#9c7420); color:#fff6df}
  .ctrls{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px);
    right:calc(env(safe-area-inset-right,0px) + 14px); display:flex; gap:10px; z-index:6}
  .ctrls button{width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer; backdrop-filter:blur(6px);
    display:grid; place-items:center; transition:transform .12s}
  .ctrls button:active{transform:scale(.9)}
  .ctrls button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .sndhint{position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 96px); z-index:5; pointer-events:none;
    font-size:13px; color:#cdd8f3; background:rgba(6,10,20,.6); border:1px solid var(--line);
    padding:8px 16px; border-radius:999px; backdrop-filter:blur(4px); text-align:center;
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  .topc{position:fixed; top:calc(env(safe-area-inset-top,0px) + 62px); left:0; right:0; z-index:4;
    pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:0 16px}
  .cd{font-size:12.5px; letter-spacing:.4px; color:#ffe6ac; background:rgba(6,10,20,.42);
    border:1px solid var(--line); padding:5px 14px; border-radius:999px; backdrop-filter:blur(4px);
    text-shadow:0 1px 3px rgba(0,0,0,.5); font-variant-numeric:tabular-nums}
  .np{font-size:12.5px; color:#d4e6ff; background:rgba(6,10,20,.42); border:1px solid var(--line);
    padding:5px 14px; border-radius:999px; backdrop-filter:blur(4px); opacity:0; transition:opacity .6s}
  .updtl{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px);
    left:calc(env(safe-area-inset-left,0px) + 14px); z-index:6; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font-size:15px; cursor:pointer; backdrop-filter:blur(6px); display:grid; place-items:center}
  .updtl:active{transform:scale(.9)}
</style>

<div id="stage"><canvas id="c"></canvas></div>
<button class="updtl" id="btnUpdTL" title="업데이트 확인" hidden>⬆</button>
<div class="ctrls">
  <button id="btnTheme" title="테마 바꾸기">🎨</button>
  <button id="btnSound" title="소리">🔊</button>
  <button id="btnReplay" title="다시">↻</button>
</div>
<div class="sndhint" id="sndHint" hidden>🔊 화면을 한 번 탭하면 소리가 켜져요</div>
<div class="topc">
  <div class="np" id="np"></div>
</div>

// 트리 입자(회전): ang/rad/y 로 매 프레임 x 계산
function makeTreePart(ang,rad,y,ch,r,g,b,delay,fs){
  return {ang,rad,y,sx:Math.random()*W,sy:Math.random()*H,ch,r:r|0,g:g|0,b:b|0,
    kind:'tree',delay,dur:1500+Math.random()*1400,fs,ph:Math.random()*6.28};
}

function buildTree(){
  const N=RM?700:1600;
  for(let k=0;k<N;k++){
    const u=Math.sqrt(Math.random());
    const y=treeTopY+(treeBaseY-treeTopY)*u;
    const t=(y-treeTopY)/(treeBaseY-treeTopY);
    const rad=treeHalf*t*Math.sqrt(Math.random());
    const ang=Math.random()*6.2832;
    let r,g,b,ch;
    if(Math.random()<0.10){const h=pick(TH.ornHue); const c=hsl(h,80,60); r=c[0];g=c[1];b=c[2]; ch=pick("oO0*@%");}
    else{const c=pick(TH.tree); const f=rnd(0.55,1.0); r=c[0]*f;g=c[1]*f;b=c[2]*f; ch=pick(TREECH);}
    const delay=300+(1-t)*3200+Math.random()*2600;
    parts.push(makeTreePart(ang,rad,y,ch,r,g,b,delay,treeFs));
  }
}

// 🎁 선물상자: 위에서 통통 떨어져 바닥에 쌓이고, 탭하면 열림
function buildGifts(){
  gifts=[];
  const cols=[[214,66,66],[74,132,236],[232,150,190],[86,196,120],[244,206,96]];
  const n=RM?3:5;
  for(let i=0;i<n;i++){
    const w=treeHalf*rnd(0.34,0.5), h=w*rnd(0.72,0.86);
    const frac=(i+0.5)/n, cx=treeCX+(frac-0.5)*treeHalf*1.65;
    const y=treeBaseY - h + rnd(2,10);
    gifts.push({x:cx-w/2, y, w, h, col:cols[i%cols.length], rib:[246,212,112],
      delay:7000+i*420+rnd(0,500), dur:1100, startY:(treeBaseY-h)-rnd(H*0.5,H*0.72),
      open:0, openT:-9999});
  }
}
const easeOutBounce=p=>{ const n1=7.5625,d1=2.75;
  if(p<1/d1) return n1*p*p;
  if(p<2/d1){ p-=1.5/d1; return n1*p*p+0.75; }
  if(p<2.5/d1){ p-=2.25/d1; return n1*p*p+0.9375; }
  p-=2.625/d1; return n1*p*p+0.984375; };
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawGifts(el,ts){
  for(const g of gifts){
    const lt=el-g.delay; if(lt<=0) continue;
    const p=Math.min(1,lt/g.dur), e=easeOutBounce(p);
    const y=g.startY+(g.y-g.startY)*e;
    if(g.open && ts-g.openT>2600) g.open=0;
    const openP=g.open?Math.min(1,(ts-g.openT)/350):0;
    const x=g.x,w=g.w,h=g.h,c=g.col,rib=g.rib;
    ctx.save();
    // 몸통
    ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')'; rr(x,y+h*0.2,w,h*0.8,4); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.13)'; rr(x+w*0.52,y+h*0.2,w*0.48,h*0.8,4); ctx.fill();
    ctx.fillStyle='rgb('+rib[0]+','+rib[1]+','+rib[2]+')'; ctx.fillRect(x+w*0.42,y+h*0.2,w*0.16,h*0.8);
    // 뚜껑 (열리면 위로 들림)
    const lcx=x+w/2, lcy=y+h*0.12-openP*h*0.62;
    ctx.save(); ctx.translate(lcx,lcy); ctx.rotate(-openP*0.22);
    ctx.fillStyle='rgb('+Math.min(255,c[0]+20)+','+Math.min(255,c[1]+20)+','+Math.min(255,c[2]+20)+')';
    rr(-w*0.57,-h*0.13,w*1.14,h*0.27,4); ctx.fill();
    ctx.fillStyle='rgb('+rib[0]+','+rib[1]+','+rib[2]+')'; ctx.fillRect(-w*0.08,-h*0.13,w*0.16,h*0.27);
    // 리본 매듭 + 나비
    ctx.beginPath(); ctx.ellipse(-w*0.15,-h*0.2,w*0.15,h*0.11,0.5,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w*0.15,-h*0.2,w*0.15,h*0.11,-0.5,0,6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-h*0.18,w*0.07,0,6.2832); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
}
function giftAt(mx,my,el){
  for(const g of gifts){ if(el<=g.delay+g.dur*0.8) continue;
    if(mx>=g.x-4 && mx<=g.x+g.w+4 && my>=g.y-g.h*0.4 && my<=g.y+g.h) return g; }

// ✨ 효과 입자 (하트 / 반짝 / 폭죽)

function drawHeart(x,y,s,col,a){
  ctx.save(); ctx.translate(x,y); ctx.scale(s/16,s/16);

function updDrawFx(ts,dt){
  ctx.save();
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.life+=dt; f.vy+=f.g*dt; f.x+=f.vx*dt; f.y+=f.vy*dt;
    const t=f.life/f.max; if(t>=1){ fx.splice(i,1); continue; }
    const a=1-t;
    if(f.type==='heart'){ drawHeart(f.x,f.y,f.size,f.col,a); }
    else { ctx.globalAlpha=a; ctx.fillStyle='rgb('+f.col[0]+','+f.col[1]+','+f.col[2]+')';
      if(f.glow){ ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8; }
      ctx.beginPath(); ctx.arc(f.x,f.y,f.size,0,6.2832); ctx.fill(); ctx.shadowBlur=0; }

function drawStocking(cx,topY,s,col,ts,i){

function roundClip(x,y,w,h,r){ rr(x,y,w,h,r); ctx.clip(); }
function drawFireplace(ts,el){
  const fade=Math.min(1,Math.max(0,(el-6000)/2500)); if(fade<=0) return;
  const w=Math.min(W*0.26,120), h=w*1.0;

  const ox=x+w*0.17, ow=w*0.66, oy=y+h*0.34, oh=h*0.6, ar=ow*0.5, fby=oy+oh-5, fcx=ox+ow/2;

  spill.addColorStop(0,'rgba(255,165,75,0.26)'); spill.addColorStop(1,'rgba(255,120,40,0)');

  // 몸통(벽돌) + 그라데이션
  const bg=ctx.createLinearGradient(x,y,x+w,y); bg.addColorStop(0,'#7c4536'); bg.addColorStop(1,'#5c342a');
  ctx.fillStyle=bg; rr(x,y,w,h,9); ctx.fill();
  // 엇갈린 벽돌 무늬

  ctx.strokeStyle='rgba(0,0,0,0.16)'; ctx.lineWidth=1;
  const bh=h*0.135, bw=w*0.27;

    ctx.beginPath(); ctx.moveTo(x,ry); ctx.lineTo(x+w,ry); ctx.stroke();
    for(let bx=x-off; bx<x+w; bx+=bw){ ctx.beginPath(); ctx.moveTo(bx,ry); ctx.lineTo(bx,ry+bh); ctx.stroke(); } }
  ctx.fillStyle='rgba(255,190,130,0.05)'; ctx.fillRect(x,y,w,h*0.45);
  ctx.restore();
  // 아치형 아궁이
  ctx.fillStyle='#140a05';
  ctx.beginPath(); ctx.moveTo(ox,oy+oh); ctx.lineTo(ox,oy+ar); ctx.arc(ox+ar,oy+ar,ar,Math.PI,0); ctx.lineTo(ox+ow,oy+oh); ctx.closePath(); ctx.fill();
  const gl=ctx.createRadialGradient(fcx,fby,2,fcx,fby,ow*0.9);

  ctx.fillStyle=gl; ctx.beginPath(); ctx.moveTo(ox,oy+oh); ctx.lineTo(ox,oy+ar); ctx.arc(ox+ar,oy+ar,ar,Math.PI,0); ctx.lineTo(ox+ow,oy+oh); ctx.closePath(); ctx.fill();
  // 장작
  ctx.fillStyle='#4a2d1a'; rr(ox+ow*0.13,fby-2,ow*0.74,5,2); ctx.fill();
  ctx.fillStyle='#38230f'; rr(ox+ow*0.22,fby-6,ow*0.56,4,2); ctx.fill();
  // 불꽃
  for(let i=0;i<5;i++){ const bx=fcx+(i-2)*ow*0.14, fl=oh*0.46*(0.55+0.45*Math.abs(Math.sin(ts*0.006+i*1.3))), fw=ow*0.14;
    const fg=ctx.createLinearGradient(0,fby,0,fby-fl);
    fg.addColorStop(0,'rgba(255,232,145,0.96)'); fg.addColorStop(0.55,'rgba(255,145,55,0.85)'); fg.addColorStop(1,'rgba(255,90,30,0)');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(bx-fw/2,fby);
    ctx.quadraticCurveTo(bx-fw*0.2,fby-fl*0.6,bx,fby-fl); ctx.quadraticCurveTo(bx+fw*0.2,fby-fl*0.6,bx+fw/2,fby); ctx.closePath(); ctx.fill(); }
  // 불씨
  for(let i=0;i<6;i++){ const t=((ts*0.00045+i*0.37)%1), ex=fcx+Math.sin(i*2+ts*0.002)*ow*0.3, ey=fby-t*oh*0.72;
    ctx.globalAlpha=fade*(1-t)*0.85; ctx.fillStyle='rgba(255,185,95,1)'; ctx.beginPath(); ctx.arc(ex,ey,1.3,0,6.2832); ctx.fill(); }
  ctx.globalAlpha=fade;
  // 선반
  ctx.fillStyle='#8a5a3b'; rr(x-9,y-14,w+18,16,4); ctx.fill();
  ctx.fillStyle='rgba(255,232,200,0.14)'; rr(x-9,y-14,w+18,5,4); ctx.fill();
  // 선반 가랜드 + 빨간 열매
  ctx.strokeStyle='#2c7a44'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); for(let gx=x-5; gx<=x+w+5; gx+=6){ const gy=y-7+Math.sin((gx-x)*0.28)*3; gx===x-5?ctx.moveTo(gx,gy):ctx.lineTo(gx,gy);} ctx.stroke();
  for(let gx=x; gx<=x+w; gx+=15){ ctx.fillStyle='#d94848'; ctx.beginPath(); ctx.arc(gx,y-6+Math.sin((gx-x)*0.28)*3,1.9,0,6.2832); ctx.fill(); }
  // 양말

// ⛄ 눈사람 (우측 하단)
function drawSnowman(ts,el){
  const fade=Math.min(1,Math.max(0,(el-6500)/2500)); if(fade<=0) return;
  const u=Math.min(W*0.052,22);

  const body=(x,y,r)=>{ const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.2,x,y,r);
    g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#cdd9ec'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); };
  body(cx,botY,u*1.3); body(cx,midY,u*0.98); body(cx,headY,u*0.72);
  // 단추
  ctx.fillStyle='#3a3f4a'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(cx,midY-u*0.5+i*u*0.5,u*0.1,0,6.2832); ctx.fill(); }
  // 팔(나뭇가지)

  ctx.beginPath(); ctx.moveTo(cx+u*0.9,midY-u*0.2); ctx.lineTo(cx+u*2.0,midY-u*0.9); ctx.moveTo(cx+u*1.5,midY-u*0.55); ctx.lineTo(cx+u*1.85,midY-u*1.15); ctx.stroke();
  // 목도리

  ctx.fillStyle='#b83535'; rr(cx+u*0.2,headY+u*0.7,u*0.33,u*0.9,u*0.1); ctx.fill();
  // 눈 / 코 / 입
  ctx.fillStyle='#2a2f38';
  ctx.beginPath(); ctx.arc(cx-u*0.26,headY-u*0.1,u*0.1,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+u*0.26,headY-u*0.1,u*0.1,0,6.2832); ctx.fill();
  ctx.fillStyle='#ef8a2b'; ctx.beginPath(); ctx.moveTo(cx,headY+u*0.04); ctx.lineTo(cx+u*0.7,headY+u*0.16); ctx.lineTo(cx,headY+u*0.22); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#2a2f38'; for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(cx-u*0.28+i*u*0.19,headY+u*0.42,u*0.05,0,6.2832); ctx.fill(); }
  // 모자
  ctx.fillStyle='#2a2f38'; rr(cx-u*0.85,headY-u*0.72,u*1.7,u*0.22,u*0.08); ctx.fill();
  rr(cx-u*0.55,headY-u*1.55,u*1.1,u*0.95,u*0.1); ctx.fill();
  ctx.fillStyle='#d64545'; rr(cx-u*0.55,headY-u*0.95,u*1.1,u*0.2,u*0.06); ctx.fill();

// 얼굴 방울(강아지/여자): 사진을 글자로
function buildFaceInto(img,cx,cy,R,delayBase){
  if(!img) return;
  const cell=Math.max(3,Math.round((2*R)/60));   // 더 촘촘히 → 훨씬 선명
  const NY=Math.max(24,Math.round(2*R/cell));
  const NX=Math.max(16,Math.round(NY*img.width/img.height));
  const oc=document.createElement('canvas'); oc.width=NX; oc.height=NY;
  const o=oc.getContext('2d'); o.drawImage(img,0,0,NX,NY);
  const d=o.getImageData(0,0,NX,NY).data;
  const cw=NX*cell, ch=NY*cell, x0=cx-cw/2, y0=cy-ch/2;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    const idx=(j*NX+i)*4, r=d[idx],g=d[idx+1],b=d[idx+2];
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    const px=x0+(i+0.5)*cell, py=y0+(j+0.5)*cell;
    const dx=px-cx, dy=py-cy;
    if(dx*dx+dy*dy>R*R*0.98) continue;
    if(lum<0.10) continue;
    const ci=Math.max(0,Math.min(RAMP.length-1,Math.floor(lum*(RAMP.length-1))));
    const norm=(py-(cy-R))/(2*R);
    const delay=delayBase+norm*3200+Math.random()*2400;
    parts.push(makePart(px,py,RAMP[ci],
      Math.min(255,r*1.14+30),Math.min(255,g*1.12+28),Math.min(255,b*1.1+30),'face',delay,cell,false));
  }
}

// 맨 위 산타 모자(빨간 고깔 + 흰 띠 + 방울)
function buildSantaHat(){
  // 트리 꼭대기에 얹히는 빨간 고깔 + 흰 띠 + 흰 방울(살짝 오른쪽으로 기움)
  const bx=treeCX, by=treeTopY+treeHalf*0.52;      // 띠(브림)가 트리 꼭대기에 살짝 겹침
  const hatH=treeHalf*1.12, baseW=treeHalf*0.74;
  const tipX=bx+treeHalf*0.32, tipY=by-hatH;
  const dx=tipX-bx, dy=tipY-by, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, px=-uy, py=ux;
  // 빨간 고깔 (브림 바로 위부터 끝까지)
  const N=RM?70:150;
  for(let k=0;k<N;k++){
    const f=0.08+Math.pow(Math.random(),0.85)*0.92;
    const cxp=bx+dx*f, cyp=by+dy*f, w=baseW*(1-f)*0.5;
    const off=(Math.random()*2-1)*w;
    parts.push(makePart(cxp+px*off, cyp+py*off, pick("#%&8@Wx"),
      rnd(195,228),rnd(44,70),rnd(44,70),'hat',10300+Math.random()*1700,treeFs,false));
  }
  // 흰 띠 (브림): 트리 꼭대기에 가로로 도톰하게
  for(let k=0;k<(RM?34:78);k++){
    const a=Math.random()*6.2832, rx=baseW*0.62, ry=treeFs*1.0;
    parts.push(makePart(bx+Math.cos(a)*rx, by+Math.sin(a)*ry*rnd(0.55,1.0),
      pick("oO0*8%@"), rnd(228,247),rnd(230,247),rnd(234,251),'hat',10000+Math.random()*1000,treeFs,false));
  }
  // 끝 방울 (폼폼)
  for(let k=0;k<(RM?18:40);k++){
    const a=Math.random()*6.2832, rr=Math.random()*treeFs*1.35;
    parts.push(makePart(tipX+Math.cos(a)*rr, tipY+Math.sin(a)*rr, pick("oO0*8%"),
      rnd(232,251),rnd(232,251),rnd(238,253),'hat',11200+Math.random()*800,treeFs,false));
  }
}

function buildLights(){
  const turns=5, n=RM?40:70;
  for(let k=0;k<n;k++){
    const f=k/(n-1), t=0.12+f*0.84, y=treeTopY+(treeBaseY-treeTopY)*t;
    lights.push({ang:f*turns*6.2832, y, half:treeHalf*t*0.9, hue:(k*47)%360, ph:Math.random()*6.28,
      delay:1400+(1-t)*2800+Math.random()*1400});
  }
}
function buildSnow(){ snow=[]; const n=RM?40:140;
  for(let k=0;k<n;k++) snow.push({x:Math.random()*W,y:Math.random()*H,r:rnd(0.7,2.4),sp:rnd(12,45),dr:rnd(-14,14),ph:Math.random()*6.28}); }
function buildBgStars(){ bgStars=[]; const n=Math.round(W*H/9000);
  for(let k=0;k<n;k++) bgStars.push({x:Math.random()*W,y:Math.random()*H*0.8,r:rnd(0.4,1.5),ph:Math.random()*6.28}); }

function buildScene(){
  parts=[]; lights=[]; orn=[];
  buildTree(); buildOrnaments(); buildLights();
  for(const B of baubles) buildFaceInto(B.img, B.cx, B.cy, B.R, B.delay);
  buildGifts(); buildSantaHat();
}

function hsl(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l); const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]; }

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeLayout(); buildBgStars(); buildSnow();
  const was = started && elapsed>ASSEMBLE;
  buildScene();
  if(was || RM){ for(const p of parts){ if(p.kind!=='tree'){p.sx=p.tx;p.sy=p.ty;} } }
}

const easeOut=p=>1-Math.pow(1-p,3);
let lastFs=-1;

// 화면 탭 → 글자가 부서져 흩어졌다가 다시 생성
let burst=null;
const BURST_DUR=0.62, BURST_G=950;
function shatter(mx,my){
  if(burst || !started) return;
  const rot=elapsed/ROT_PERIOD*6.2832;
  for(const p of parts){
    let cx,cy;
    if(p.kind==='tree'){ cx=treeCX+Math.sin(p.ang+rot)*p.rad; cy=p.y; }
    else { cx=p.tx; cy=p.ty; }
    p.ex=cx; p.ey=cy;
    let dx=cx-mx, dy=cy-my, d=Math.hypot(dx,dy)||1;
    const sp=rnd(280,660);
    p.vx=(dx/d)*sp+rnd(-130,130);
    p.vy=(dy/d)*sp+rnd(-150,110)-rnd(40,170);
  }
  burst={t0:performance.now()};
}
function endBurst(ts){
  for(const p of parts){
    const ex=p.ex+p.vx*BURST_DUR, ey=p.ey+p.vy*BURST_DUR+0.5*BURST_G*BURST_DUR*BURST_DUR;
    p.sx=ex; p.sy=ey;
  }
  burst=null; t0=ts;                 // 전체 생성 순서를 처음부터 다시
}
function drawBurst(ts,tb){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fade=Math.max(0,1-tb/BURST_DUR);
  for(const p of parts){
    const x=p.ex+p.vx*tb, y=p.ey+p.vy*tb+0.5*BURST_G*tb*tb;
    if(p.fs!==lastFs){ ctx.font=p.fs+'px ui-monospace,Menlo,monospace'; lastFs=p.fs; }
    ctx.fillStyle='rgba('+(p.r|0)+','+(p.g|0)+','+(p.b|0)+','+(0.95*fade).toFixed(3)+')';
    ctx.fillText(p.ch,x,y);
  }
}
function drawParts(time,el,rot){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of parts){
    const lt=el-p.delay; if(lt<=0) continue;
    const pr=Math.min(1,lt/p.dur), e=easeOut(pr);
    let tx,ty,depthA=1;
    if(p.kind==='tree'){
      const cosv=Math.cos(p.ang+rot);
      tx=treeCX+Math.sin(p.ang+rot)*p.rad; ty=p.y;
      depthA=0.42+0.58*((cosv+1)/2);
    } else { tx=p.tx; ty=p.ty; }
    let x=p.sx+(tx-p.sx)*e, y=p.sy+(ty-p.sy)*e, a=pr;
    if(pr>=1){
      if(p.kind==='face') a=0.9+0.1*Math.sin(time*0.0035+p.ph);
      else if(p.kind==='hat') a=0.9+0.1*Math.sin(time*0.004+p.ph);
      else if(p.kind==='gift') a=0.92+0.08*Math.sin(time*0.004+p.ph);
      else a=(0.82+0.18*Math.sin(time*0.004+p.ph))*depthA;
    } else if(p.kind==='tree') a*=depthA;
    if(p.fs!==lastFs){ ctx.font=p.fs+'px ui-monospace,Menlo,monospace'; lastFs=p.fs; }
    ctx.fillStyle='rgba('+(p.r|0)+','+(p.g|0)+','+(p.b|0)+','+a.toFixed(3)+')';
    ctx.fillText(p.ch,x,y);
  }
}

function drawOrnaments(time,el,rot){
  for(const o of orn){
    const lt=el-o.delay; if(lt<=0) continue;
    const cosv=Math.cos(o.ang+rot); if(cosv<-0.25) continue;
    const sc=easeOut(Math.min(1,lt/600));
    const x=treeCX+Math.sin(o.ang+rot)*o.half, y=o.y, R=o.size*sc;
    const front=0.45+0.55*((cosv+1)/2), c=hsl(o.hue,85,58);
    ctx.globalAlpha=front;
    ctx.shadowColor='hsl('+o.hue+',90%,55%)'; ctx.shadowBlur=7;
    ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
    ctx.beginPath(); ctx.arc(x,y,R,0,6.2832); ctx.fill();
    ctx.shadowBlur=0;
    ctx.globalAlpha=front*0.85; ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(x-R*0.3,y-R*0.33,R*0.28,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
}

let litCount=0;
function drawLights(time,el,rot){
  ctx.save(); let lit=0;
  for(const L of lights){
    const lt=el-L.delay; if(lt<=0) continue;
    const cosv=Math.cos(L.ang+rot); if(cosv<-0.3) continue; lit++;
    const fin=Math.min(1,lt/900), tw=0.4+0.6*Math.max(0,Math.sin(time*0.005+L.ph));
    const front=0.4+0.6*((cosv+1)/2);
    ctx.globalAlpha=fin*(0.3+0.7*tw)*front;
    ctx.fillStyle='hsl('+L.hue+',90%,'+(58+tw*14)+'%)';
    ctx.shadowColor='hsl('+L.hue+',95%,60%)'; ctx.shadowBlur=8+tw*8;
    ctx.beginPath(); ctx.arc(treeCX+Math.sin(L.ang+rot)*L.half, L.y, 1.7+tw*1.5,0,6.2832); ctx.fill();
  }
  ctx.restore(); litCount=lit;
}

function drawBaubles(time,el){
  for(const B of baubles){
    if(!B.img) continue;
    const rev=Math.min(1,Math.max(0,(el-5200)/4500)); if(rev<=0) continue;
    ctx.save();
    ctx.globalAlpha=0.5*rev; ctx.strokeStyle='rgba(200,215,255,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(B.cx,B.cy-B.R); ctx.lineTo(B.cx,Math.max(0,B.cy-B.R-H*0.08)); ctx.stroke();
    const g=ctx.createRadialGradient(B.cx,B.cy,B.R*0.2,B.cx,B.cy,B.R*1.08);
    g.addColorStop(0,'rgba(30,52,86,'+(0.5*rev)+')');
    g.addColorStop(0.7,'rgba(16,28,52,'+(0.4*rev)+')');
    g.addColorStop(1,'rgba(10,16,34,0)');
    ctx.globalAlpha=1; ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(B.cx,B.cy,B.R*1.08,0,6.2832); ctx.fill();
    for(let i=0;i<56;i++){
      const an=i/56*6.2832, tw=0.45+0.55*Math.sin(time*0.004+i*0.6);
      ctx.globalAlpha=rev*(0.3+0.6*tw); ctx.fillStyle='rgba(190,215,255,0.9)';
      ctx.beginPath(); ctx.arc(B.cx+Math.cos(an)*B.R*1.06, B.cy+Math.sin(an)*B.R*1.06, 1.3,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=rev; ctx.fillStyle='rgba(232,184,75,.9)';
    ctx.beginPath(); ctx.arc(B.cx,B.cy-B.R,3.2,0,6.2832); ctx.fill();
    ctx.restore();
  }
}

function drawSnow(time,dt){
  ctx.save(); ctx.fillStyle='#fff';
  for(const s of snow){
    s.y+=s.sp*dt; s.x+=Math.sin(time*0.001+s.ph)*s.dr*dt;
    if(s.y>H+4){s.y=-4; s.x=Math.random()*W;}
    if(s.x<-4)s.x=W+4; if(s.x>W+4)s.x=-4;
    ctx.globalAlpha=0.5+0.4*Math.sin(time*0.003+s.ph);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
  }
  ctx.restore();
}
function drawBgStars(time){
  ctx.save(); ctx.fillStyle='#dfe8ff';
  for(const st of bgStars){
    ctx.globalAlpha=0.25+0.55*Math.abs(Math.sin(time*0.002+st.ph));
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

// 🌌 오로라(은은한 밤하늘)
function drawAurora(ts){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const bands=TH.aurora;
  for(let bi=0;bi<bands.length;bi++){
    const b=bands[bi], yBase=H*b[4];
    ctx.beginPath(); ctx.moveTo(0,yBase);
    for(let x=0;x<=W;x+=22){ const y=yBase+Math.sin(x*0.012+ts*0.0004+bi)*16+Math.sin(x*0.03+ts*0.0007)*7; ctx.lineTo(x,y); }
    ctx.lineTo(W,yBase+64); ctx.lineTo(0,yBase+64); ctx.closePath();
    const gr=ctx.createLinearGradient(0,yBase-26,0,yBase+64);
    gr.addColorStop(0,'rgba('+b[0]+','+b[1]+','+b[2]+','+b[3]+')');
    gr.addColorStop(1,'rgba('+b[0]+','+b[1]+','+b[2]+',0)');
    ctx.fillStyle=gr; ctx.fill();
  }
  ctx.restore();
}
// 🌠 별똥별
let shoots=[], nextShoot=0, nextFw=0;
function drawShoots(ts,dt){
  if(ts>nextShoot){
    const fromLeft=Math.random()<0.5;
    const x=fromLeft?rnd(0,W*0.35):rnd(W*0.65,W), y=rnd(0,H*0.3);
    const ang=fromLeft?rnd(0.25,0.5):(Math.PI-rnd(0.25,0.5)), sp=rnd(620,920);
    shoots.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:0,max:rnd(0.7,1.1),len:rnd(90,160)});
    nextShoot=ts+rnd(3600,8200);
  }
  ctx.save(); ctx.lineCap='round';
  for(let i=shoots.length-1;i>=0;i--){
    const s=shoots[i]; s.life+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt;
    const t=s.life/s.max;
    if(t>=1||s.y>H||s.x<-20||s.x>W+20){ shoots.splice(i,1); continue; }
    const a=Math.sin(t*Math.PI), nrm=1/Math.hypot(s.vx,s.vy);
    const bx=s.x-s.vx*nrm*s.len, by=s.y-s.vy*nrm*s.len;
    const gr=ctx.createLinearGradient(bx,by,s.x,s.y);
    gr.addColorStop(0,'rgba(180,220,255,0)'); gr.addColorStop(1,'rgba(225,240,255,'+(0.9*a).toFixed(3)+')');
    ctx.strokeStyle=gr; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(s.x,s.y); ctx.stroke();
    ctx.globalAlpha=a; ctx.fillStyle='#eaf4ff'; ctx.beginPath(); ctx.arc(s.x,s.y,2,0,6.2832); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.restore();
}

let prevTs=0;
function render(ts){
  const dt=Math.min(0.05,(ts-prevTs)/1000)||0.016; prevTs=ts;
  if(burst){
    const tb=(ts-burst.t0)/1000;
    if(tb<BURST_DUR){
      ctx.clearRect(0,0,W,H); drawBgStars(ts); drawAurora(ts); drawBurst(ts,tb);
      updDrawFx(ts,dt); drawSnowBank(dt); drawSnow(ts,dt);
      return;
    }
    endBurst(ts);
  }
  elapsed = started ? ts-t0 : 0;
  const rot = elapsed/ROT_PERIOD*6.2832;
  ctx.clearRect(0,0,W,H);
  drawBgStars(ts);

  if(started){
    drawBaubles(ts,elapsed);
    drawParts(ts,elapsed,rot);
    drawFireplace(ts,elapsed);

    drawOrnaments(ts,elapsed,rot);

  updDrawFx(ts,dt);

}

function noteHz(n){
  const m={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const name=n.slice(0,-1), oct=+n.slice(-1);
  return 440*Math.pow(2,((oct+1)*12+m[name]-69)/12);
}

let actx=null, master=null, seqIdx=0, nextTime=0, schedTimer=null, soundOn=true;
function initAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.0001; master.connect(actx.destination);
    master.gain.setValueAtTime(0.0001,actx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.42,actx.currentTime+1.6);
    nextTime=actx.currentTime+0.2; seqIdx=0;
    schedTimer=setInterval(scheduler,25);
  }catch(e){ actx=null; }
}
function scheduler(){
  if(!actx || actx.state!=='running') return;
  while(nextTime<actx.currentTime+0.14){
    const [nm,b]=song.notes[seqIdx], dur=b*song.beat;
    if(nm) playNote(noteHz(nm),nextTime,dur);
    nextTime+=dur; seqIdx=(seqIdx+1)%song.notes.length;
  }
}
function playNote(freq,time,dur){
  const g=actx.createGain(); g.connect(master);
  const o=actx.createOscillator(); o.type='triangle'; o.frequency.value=freq; o.connect(g);
  const sub=actx.createOscillator(); sub.type='sine'; sub.frequency.value=freq/2;
  const sg=actx.createGain(); sg.gain.value=0.0001; sub.connect(sg); sg.connect(master);
  const a=0.012, d=Math.min(0.14,dur*0.35);
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(0.85,time+a);
  g.gain.exponentialRampToValueAtTime(0.22,time+a+d);
  g.gain.setValueAtTime(0.22,time+dur*0.72);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.97);
  sg.gain.setValueAtTime(0.0001,time);
  sg.gain.exponentialRampToValueAtTime(0.2,time+a+0.03);
  sg.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.9);
  o.start(time); o.stop(time+dur+0.02); sub.start(time); sub.stop(time+dur+0.02);
}
const sndHint=document.getElementById('sndHint');
function refreshHint(){ sndHint.hidden = !(soundOn && (!actx || actx.state!=='running')); }
function tryResumeAudio(){
  if(!actx) initAudio();
  if(actx && actx.state!=='running'){ actx.resume().then(()=>{nextTime=actx.currentTime+0.1; refreshHint();}).catch(()=>{}); }
  refreshHint();
}
window.__pauseAudio=function(){ try{ if(actx && actx.state==='running') actx.suspend(); }catch(e){} };
window.__resumeAudio=function(){ try{ if(actx && soundOn && actx.state!=='running'){ actx.resume().then(()=>{nextTime=actx.currentTime+0.1;}); } }catch(e){} refreshHint(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden) window.__pauseAudio(); else window.__resumeAudio(); });
window.addEventListener('pagehide',()=>window.__pauseAudio());
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('btnSound').textContent=soundOn?'🔊':'🔇';
  if(!actx){ if(soundOn) tryResumeAudio(); return; }
  if(soundOn) actx.resume().then(()=>{nextTime=actx.currentTime+0.1;}).catch(()=>{});
  else actx.suspend().catch(()=>{});
  refreshHint();
}

// ---------- boot ----------
function start(){
  if(started) return;
  started=true; t0=performance.now();
  if(RM){ t0=performance.now()-ASSEMBLE-200; for(const p of parts){ if(p.kind!=='tree'){p.sx=p.tx;p.sy=p.ty;} } }
  initAudio(); setTimeout(refreshHint,700);
  setTimeout(showNowPlaying,900);
  const once=()=>tryResumeAudio();
  window.addEventListener('pointerdown',once,{passive:true});
  window.addEventListener('touchstart',once,{passive:true});
  window.addEventListener('keydown',once);
}
function replay(){
  for(const p of parts){ if(p.kind==='tree'){p.sx=Math.random()*W;p.sy=Math.random()*H;} else {p.sx=(p.kind==='gift')?p.tx+rnd(-18,18):Math.random()*W; p.sy=(p.kind==='gift')?p.ty-rnd(H*0.5,H*0.75):Math.random()*H;} }
  t0=performance.now();
  if(RM){ t0=performance.now()-ASSEMBLE-200; for(const p of parts){ if(p.kind!=='tree'){p.sx=p.tx;p.sy=p.ty;} } }
}
document.getElementById('btnSound').addEventListener('click',toggleSound);
document.getElementById('btnReplay').addEventListener('click',replay);
// 캔버스 탭 → 선물=열기 / 더블탭=폭죽 / 한 번 탭=부서졌다 재생성 (+ 브라우저에선 소리 켜기)
let lastTapT=0, tapTimer=null;
cv.addEventListener('pointerdown',e=>{
  tryResumeAudio();
  const mx=e.clientX, my=e.clientY, now=performance.now();
  const g=giftAt(mx,my,elapsed);
  if(g){ openGift(g,now); lastTapT=0; if(tapTimer){clearTimeout(tapTimer);tapTimer=null;} return; }
  if(now-lastTapT<280){                      // 더블탭 → 🎆 폭죽
    if(tapTimer){ clearTimeout(tapTimer); tapTimer=null; }
    lastTapT=0;
    for(let k=0;k<3;k++){ const px=mx+rnd(-60,60), py=my+rnd(-55,45); setTimeout(()=>spawnFirework(px,py,null), k*150); }
    return;
  }
  lastTapT=now;
  if(tapTimer) clearTimeout(tapTimer);
  tapTimer=setTimeout(()=>{ tapTimer=null; shatter(mx,my); }, 255);   // 단일 탭 → 부서짐(더블탭 판별용 지연)
});
// 🎨 테마 전환
function setTheme(name){
  themeName=name; TH=THEMES[name]||THEMES.classic;

}
document.getElementById('btnTheme').addEventListener('click',()=>{

if (window.AndroidApp){ const u=document.getElementById('btnUpdTL'); u.hidden=false;

function imgDone(){ pending--; if(pending<=0){ resize(); start(); } }
