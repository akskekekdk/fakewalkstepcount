<title>글자 크리스마스 트리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Gaegu:wght@700&display=swap">
<style>
  /* Layout: fullscreen night-sky canvas with letter particles; HUD + banner overlays on top. Single committed dark world. */
  :root{
    --bg:#070b18; --bg2:#04060e;
    --ink:#e8eefc; --muted:#8fa0c4;
    --green:#2fae55; --red:#d14545; --gold:#e8b84b;
    --panel:rgba(10,15,30,.72); --line:rgba(255,255,255,.14);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(120% 90% at 55% 20%,#0d1430 0%,var(--bg) 45%,var(--bg2) 100%);
    color:var(--ink); font-family:"Space Grotesk",system-ui,sans-serif; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed; inset:0}
  canvas{display:block; width:100%; height:100%}

  /* HUD (reel homage) */
  .hud{position:fixed; top:env(safe-area-inset-top,0); left:0;
    padding:14px 0 0 max(16px,env(safe-area-inset-left,0px));
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; line-height:1.55;
    color:var(--muted); pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.6); z-index:4}
  .hud b{color:#cdd8f3; font-weight:500; font-variant-numeric:tabular-nums}
  .filebar{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    text-align:center; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--muted);
    pointer-events:none; z-index:4; letter-spacing:.3px}
  .filebar .dot{color:#3ddc84}

  /* Banner */
  .banner{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 34px);
    display:flex; flex-direction:column; align-items:center; gap:9px; z-index:4; pointer-events:none;
    padding:0 max(16px,env(safe-area-inset-left,0px))}
  .word{display:flex; gap:5px}
  .word span{font-weight:700; font-size:clamp(14px,4.6vw,22px); letter-spacing:2px;
    width:1.5em; height:1.5em; display:grid; place-items:center; border-radius:6px;
    background:rgba(255,255,255,.05); color:#dfe7fb;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 3px 12px rgba(0,0,0,.4)}
  .word.g span{background:linear-gradient(180deg,#1f7d3f,#14532a); color:#dff6e6}
  .word.r span{background:linear-gradient(180deg,#b23a3a,#7a2626); color:#ffe4e1}
  .word.y span{background:linear-gradient(180deg,#d8a93f,#9c7420); color:#fff6df}
  .caption{font-family:"Gaegu",system-ui,sans-serif; font-size:clamp(16px,5vw,24px); color:#ffe9b8;
    text-shadow:0 0 14px rgba(232,184,75,.5),0 2px 6px rgba(0,0,0,.8); text-align:center}
  .caption:empty{display:none}
  .caption:not(:empty){background:rgba(6,10,20,.5); padding:4px 16px; border-radius:999px;
    backdrop-filter:blur(3px); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}

  /* Controls */
  .ctrls{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px);
    right:calc(env(safe-area-inset-right,0px) + 14px); display:flex; gap:10px; z-index:6}
  .ctrls button{width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer; backdrop-filter:blur(6px);
    display:grid; place-items:center; transition:transform .12s, background .2s}
  .ctrls button:active{transform:scale(.9)}
  .ctrls button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

  /* Start overlay */
  .start{position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:24px;
    background:radial-gradient(110% 80% at 50% 35%,rgba(13,20,48,.5),rgba(4,6,14,.85));
    backdrop-filter:blur(2px)}
  .card{width:min(420px,92vw); text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px}
  .card h1{margin:0; font-size:clamp(22px,7vw,32px); font-weight:700; line-height:1.2; text-wrap:balance}
  .card h1 .em{color:var(--gold)}
  .card p{margin:0; color:var(--muted); font-size:14.5px; line-height:1.6}
  .namewrap{width:100%; display:flex; flex-direction:column; gap:7px; text-align:left}
  .namewrap label{font-size:12.5px; color:var(--muted); padding-left:2px}
  .namewrap input{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:rgba(255,255,255,.06); color:var(--ink); font-size:15px; font-family:inherit}
  .namewrap input:focus{outline:none; border-color:var(--gold); background:rgba(255,255,255,.09)}
  .go{margin-top:4px; padding:15px 30px; border:none; border-radius:999px; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:17px; color:#06210f;
    background:linear-gradient(180deg,#54d983,#2fae55); box-shadow:0 8px 24px rgba(47,174,85,.4)}
  .go:active{transform:scale(.97)}
  .hint{font-size:12px; color:#6f80a6}
  .treehint{font-size:40px; filter:drop-shadow(0 0 18px rgba(80,220,140,.5))}
</style>

<div id="stage"><canvas id="c"></canvas></div>

<div class="hud" id="hud">
  <div>rotation <b id="sRot">0.00</b>°</div>
  <div>lights&nbsp;&nbsp;&nbsp;<b id="sLit">0</b></div>
  <div>letters&nbsp;&nbsp;<b id="sLet">0</b></div>
</div>

<div class="banner" aria-hidden="true">
  <div class="caption" id="cap"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
    <div class="word g"><span>M</span><span>E</span><span>R</span><span>R</span><span>Y</span></div>
    <div class="word r"><span>X</span><span>M</span><span>A</span><span>S</span></div>
    <div class="word y"><span>2</span><span>0</span><span>2</span><span>6</span></div>
  </div>
</div>

<div class="filebar"><span class="dot">●</span> christmas_tree.py · running · 30 fps</div>

<div class="ctrls" hidden id="ctrls">
  <button id="btnSound" title="소리">🔊</button>
  <button id="btnReplay" title="다시">↻</button>
</div>

<div class="start" id="start">
  <div class="card">
    <div class="treehint">🎄</div>
    <h1>글자로 피어나는<br><span class="em">크리스마스 트리</span></h1>
    <p>수천 개의 글자가 모여 트리가 세워지고,<br>옆 구슬 안에 우리 아이 얼굴이 떠올라요.<br>크리스마스 노래와 함께 ✨</p>
    <div class="namewrap">
      <label for="nm">아이 이름 · 메시지 (선택)</label>
      <input id="nm" type="text" maxlength="24" placeholder="예) 사랑해 ❤️ / 메리크리스마스" autocomplete="off">
    </div>
    <button class="go" id="go">▶ 시작하기</button>
    <div class="hint">소리가 함께 재생됩니다 🔊</div>
  </div>
</div>

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
let parts=[], lights=[], snow=[], bgStars=[], faceImg=null;
let t0=0, started=false, elapsed=0;
const ASSEMBLE=6000;

// layout vars
let treeCX,treeBaseY,treeTopY,treeHalf,starR,faceCX,faceCY,faceR,treeFs;

function computeLayout(){
  treeCX=W*0.565; treeBaseY=H*0.845; treeTopY=H*0.305;
  treeHalf=Math.min(W*0.345,(treeBaseY-treeTopY)*0.44);
  starR=treeHalf*0.30;
  faceR=Math.min(W*0.26,H*0.21,150); faceCX=W*0.30; faceCY=H*0.295;
  treeFs=Math.max(10,Math.min(15,Math.round(Math.min(W,H)/52)));
}

const GREENS=[[52,170,84],[70,200,105],[38,140,66],[120,210,130],[26,120,52],[95,215,135],[46,158,80]];
const ORN=[[232,78,78],[245,205,90],[110,165,245],[225,225,235],[242,150,190],[255,170,90]];
const TREECH="@#%&$*oO0xX=+:^WMKAB8?svzHND";
const RAMP=" .,:;!=+*oxscnXMW8%@#";

function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[(Math.random()*a.length)|0];}

function makePart(tx,ty,ch,r,g,b,kind,delay,fs){
  return {tx,ty,sx:Math.random()*W,sy:Math.random()*H,ch,
    r:r|0,g:g|0,b:b|0,kind,delay,dur:850+Math.random()*750,fs,ph:Math.random()*6.28};
}

function buildTree(){
  const N=RM?700:1550;
  for(let k=0;k<N;k++){
    const u=Math.sqrt(Math.random());
    const y=treeTopY+(treeBaseY-treeTopY)*u;
    const t=(y-treeTopY)/(treeBaseY-treeTopY);
    const half=treeHalf*t;
    const x=treeCX+(Math.random()*2-1)*half;
    let r,g,b,ch;
    if(Math.random()<0.11){const c=pick(ORN); r=c[0];g=c[1];b=c[2]; ch=pick("oO0*@%");}
    else{const c=pick(GREENS); const f=rnd(0.55,1.0); r=c[0]*f;g=c[1]*f;b=c[2]*f; ch=pick(TREECH);}
    const delay=200+(1-t)*1600+Math.random()*1300;
    parts.push(makePart(x,y,ch,r,g,b,'tree',delay,treeFs));
  }
}

function buildGifts(){
  const specs=[[treeCX-treeHalf*0.55,treeHalf*0.42,[210,70,70],[245,205,90]],
               [treeCX+treeHalf*0.30,treeHalf*0.5,[90,140,235],[245,205,90]],
               [treeCX+treeHalf*0.78,treeHalf*0.36,[230,150,190],[235,235,245]]];
  for(const [bx,bw,col,rib] of specs){
    const bh=bw*0.82, cell=Math.max(treeFs-1,9);
    const cols=Math.max(3,Math.round(bw/cell)), rows=Math.max(3,Math.round(bh/cell));
    const x0=bx-cols*cell/2, y0=treeBaseY+6;
    const midc=(cols/2)|0, midr=(rows/2)|0;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const ribbon=(i===midc||j===midr);
      const c=ribbon?rib:col;
      parts.push(makePart(x0+i*cell+cell/2, y0+j*cell+cell/2, ribbon?'H':pick("#%&8"),
        c[0],c[1],c[2],'tree',1400+Math.random()*900,cell));
    }
  }
}

function buildStar(){
  const cx=treeCX, cy=treeTopY-starR*0.15, pts=[];
  for(let i=0;i<5;i++){const a=-Math.PI/2+i*(4*Math.PI/5); pts.push([cx+Math.cos(a)*starR,cy+Math.sin(a)*starR]);}
  for(let i=0;i<5;i++){
    const p=pts[i],q=pts[(i+1)%5],steps=16;
    for(let s=0;s<steps;s++){const f=s/steps;
      parts.push(makePart(p[0]+(q[0]-p[0])*f, p[1]+(q[1]-p[1])*f,'*',255,222,120,'star',2100+Math.random()*700,treeFs+1));}
  }
  for(let k=0;k<10;k++){const a=Math.random()*6.28, rr=Math.random()*starR*0.4;
    parts.push(makePart(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr,'+',255,235,160,'star',2300+Math.random()*500,treeFs));}
}

function buildLights(){
  const turns=5, n=RM?40:74;
  for(let k=0;k<n;k++){
    const f=k/(n-1), y=treeTopY+(treeBaseY-treeTopY)*(0.1+f*0.86), t=(y-treeTopY)/(treeBaseY-treeTopY);
    const half=treeHalf*t, ang=f*turns*2*Math.PI;
    lights.push({x:treeCX+Math.sin(ang)*half*0.93, y, hue:(k*47)%360, ph:Math.random()*6.28,
      delay:800+(1-t)*1400+Math.random()*700});
  }
}

function buildFace(){
  if(!faceImg) return;
  const cell=Math.max(5,Math.round((2*faceR)/40));
  const NY=Math.max(20,Math.round(2*faceR/cell));
  const NX=Math.max(14,Math.round(NY*faceImg.width/faceImg.height));
  const oc=document.createElement('canvas'); oc.width=NX; oc.height=NY;
  const o=oc.getContext('2d'); o.drawImage(faceImg,0,0,NX,NY);
  const d=o.getImageData(0,0,NX,NY).data;
  const cw=NX*cell, ch=NY*cell;
  const x0=faceCX-cw/2, y0=faceCY-ch/2;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    const idx=(j*NX+i)*4, r=d[idx],g=d[idx+1],b=d[idx+2];
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    const px=x0+(i+0.5)*cell, py=y0+(j+0.5)*cell;
    const dx=px-faceCX, dy=py-faceCY;
    if(dx*dx+dy*dy>faceR*faceR*0.97) continue;
    if(lum<0.17) continue;
    const ci=Math.max(0,Math.min(RAMP.length-1,Math.floor(lum*(RAMP.length-1))));
    const norm=(py-(faceCY-faceR))/(2*faceR);
    const delay=500+norm*1500+Math.random()*900;
    parts.push(makePart(px,py,RAMP[ci],
      Math.min(255,r*1.1+26),Math.min(255,g*1.08+24),Math.min(255,b*1.06+28),'face',delay,cell));
  }
}

function buildSnow(){
  snow=[]; const n=RM?40:140;
  for(let k=0;k<n;k++) snow.push({x:Math.random()*W,y:Math.random()*H,r:rnd(0.7,2.4),
    sp:rnd(12,45),dr:rnd(-14,14),ph:Math.random()*6.28});
}
function buildBgStars(){
  bgStars=[]; const n=Math.round(W*H/9000);
  for(let k=0;k<n;k++) bgStars.push({x:Math.random()*W,y:Math.random()*H*0.8,r:rnd(0.4,1.5),ph:Math.random()*6.28});
}

function buildScene(instant){
  parts=[]; lights=[];
  buildFace(); buildTree(); buildGifts(); buildLights(); buildStar();
  if(instant){ for(const p of parts){p.sx=p.tx; p.sy=p.ty;} }
}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeLayout();
  buildBgStars(); buildSnow();
  const wasAssembled = started && elapsed>ASSEMBLE;
  buildScene(wasAssembled || !started ? false : false);
  if(wasAssembled){ for(const p of parts){p.sx=p.tx;p.sy=p.ty;} }
}

// ---------- render ----------
const easeOut=p=>1-Math.pow(1-p,3);
let lastFs=-1;
function drawParts(time,el){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const sway=Math.sin(time*0.0009)*2.4;
  for(const p of parts){
    const lt=el-p.delay; if(lt<=0) continue;
    const pr=Math.min(1,lt/p.dur), e=easeOut(pr);
    let x=p.sx+(p.tx-p.sx)*e, y=p.sy+(p.ty-p.sy)*e;
    let a=pr;
    if(pr>=1){
      a=0.82+0.18*Math.sin(time*0.004+p.ph);
      if(p.kind==='tree'){ const h=1-(p.ty-treeTopY)/(treeBaseY-treeTopY); x+=sway*h; }
      else if(p.kind==='star'){ a=0.7+0.3*Math.sin(time*0.006+p.ph); }
    }
    if(p.fs!==lastFs){ ctx.font=p.fs+'px ui-monospace,Menlo,monospace'; lastFs=p.fs; }
    ctx.fillStyle='rgba('+(p.r|0)+','+(p.g|0)+','+(p.b|0)+','+a.toFixed(3)+')';
    ctx.fillText(p.ch,x,y);
  }
}

function drawBauble(time,el){
  // soft disc + ring + hanger behind the face letters
  let rev=Math.min(1,Math.max(0,(el-400)/2600));
  if(rev<=0) return;
  ctx.save();
  // hanger line to top
  ctx.globalAlpha=0.5*rev; ctx.strokeStyle='rgba(200,215,255,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(faceCX,faceCY-faceR); ctx.lineTo(faceCX,Math.max(0,faceCY-faceR-H*0.1)); ctx.stroke();
  // glow disc
  const g=ctx.createRadialGradient(faceCX,faceCY,faceR*0.2,faceCX,faceCY,faceR*1.08);
  g.addColorStop(0,'rgba(30,52,86,'+(0.5*rev)+')');
  g.addColorStop(0.7,'rgba(16,28,52,'+(0.4*rev)+')');
  g.addColorStop(1,'rgba(10,16,34,0)');
  ctx.globalAlpha=1; ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(faceCX,faceCY,faceR*1.08,0,6.2832); ctx.fill();
  // dotted ring
  const dots=56;
  for(let i=0;i<dots;i++){
    const a=i/dots*6.2832, tw=0.45+0.55*Math.sin(time*0.004+i*0.6);
    ctx.globalAlpha=rev*(0.3+0.6*tw);
    ctx.fillStyle='rgba(190,215,255,0.9)';
    ctx.beginPath(); ctx.arc(faceCX+Math.cos(a)*faceR*1.06, faceCY+Math.sin(a)*faceR*1.06, 1.4,0,6.2832); ctx.fill();
  }
  // cap
  ctx.globalAlpha=rev; ctx.fillStyle='rgba(232,184,75,.9)';
  ctx.beginPath(); ctx.arc(faceCX,faceCY-faceR,3.4,0,6.2832); ctx.fill();
  ctx.restore();
}

function drawLights(time,el){
  ctx.save();
  let lit=0;
  for(const L of lights){
    const lt=el-L.delay; if(lt<=0) continue; lit++;
    const fin=Math.min(1,lt/700);
    const tw=0.4+0.6*Math.max(0,Math.sin(time*0.005+L.ph));
    ctx.globalAlpha=fin*(0.35+0.65*tw);
    ctx.fillStyle='hsl('+L.hue+',90%,'+(58+tw*14)+'%)';
    ctx.shadowColor='hsl('+L.hue+',95%,60%)'; ctx.shadowBlur=8+tw*8;
    ctx.beginPath(); ctx.arc(L.x,L.y,1.7+tw*1.6,0,6.2832); ctx.fill();
  }
  ctx.restore();
  litCount=lit;
}

function drawSnow(time,dt){
  ctx.save(); ctx.fillStyle='#fff';
  for(const s of snow){
    s.y+=s.sp*dt; s.x+=Math.sin(time*0.001+s.ph)*s.dr*dt;
    if(s.y>H+4){s.y=-4; s.x=Math.random()*W;}
    if(s.x<-4)s.x=W+4; if(s.x>W+4)s.x=-4;
    ctx.globalAlpha=0.5+0.4*Math.sin(time*0.003+s.ph);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

function drawBgStars(time){
  ctx.save(); ctx.fillStyle='#dfe8ff';
  for(const st of bgStars){
    ctx.globalAlpha=0.25+0.55*Math.abs(Math.sin(time*0.002+st.ph));
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

let litCount=0, prevTs=0;
const sRot=document.getElementById('sRot'), sLit=document.getElementById('sLit'), sLet=document.getElementById('sLet');
function updateHud(el){
  sRot.textContent=((el*0.05)%360).toFixed(2);
  sLit.textContent=litCount;
  let n=0; for(const p of parts) if(el>p.delay) n++;
  sLet.textContent=n.toLocaleString();
}

function render(ts){
  const dt=Math.min(0.05,(ts-prevTs)/1000)||0.016; prevTs=ts;
  elapsed = started ? ts-t0 : 0;
  ctx.clearRect(0,0,W,H);
  drawBgStars(ts);
  if(started){
    drawBauble(ts,elapsed);
    drawParts(ts,elapsed);
    drawLights(ts,elapsed);
  }
  drawSnow(ts,dt);
  if(started) updateHud(elapsed);
}
let lastFrame=0;
function loop(ts){ requestAnimationFrame(loop); if(ts-lastFrame<30) return; lastFrame=ts; render(ts); }

// ---------- audio: Jingle Bells ----------
const F={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.0,A4:440.0,B4:493.88,C5:523.25};
const N='E4',G='G4',C='C4',D='D4',Ff='F4';
const SONG=[
 ['E4',1],['E4',1],['E4',2], ['E4',1],['E4',1],['E4',2],
 ['E4',1],['G4',1],['C4',1],['D4',1], ['E4',4],
 ['F4',1],['F4',1],['F4',1],['F4',1], ['F4',1],['E4',1],['E4',1],['E4',0.5],['E4',0.5],
 ['E4',1],['D4',1],['D4',1],['E4',1], ['D4',2],['G4',2],
 ['E4',1],['E4',1],['E4',2], ['E4',1],['E4',1],['E4',2],
 ['E4',1],['G4',1],['C4',1],['D4',1], ['E4',4],
 ['F4',1],['F4',1],['F4',1],['F4',1], ['F4',1],['E4',1],['E4',1],['E4',0.5],['E4',0.5],
 ['G4',1],['G4',1],['F4',1],['D4',1], ['C4',4]
];
const BEAT=60/116;
let actx=null, master=null, seqIdx=0, nextTime=0, schedTimer=null, soundOn=true;
function initAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=0.0001; master.connect(actx.destination);
  master.gain.setValueAtTime(0.0001,actx.currentTime);
  master.gain.exponentialRampToValueAtTime(0.42,actx.currentTime+1.4);
  nextTime=actx.currentTime+0.2; seqIdx=0;
  schedTimer=setInterval(scheduler,25);
}
function scheduler(){
  if(!actx) return;
  while(nextTime<actx.currentTime+0.14){
    const [nm,b]=SONG[seqIdx], dur=b*BEAT;
    if(nm) playNote(F[nm],nextTime,dur);
    nextTime+=dur; seqIdx=(seqIdx+1)%SONG.length;
  }
}
function playNote(freq,time,dur){
  const g=actx.createGain(); g.connect(master);
  const o=actx.createOscillator(); o.type='triangle'; o.frequency.value=freq; o.connect(g);
  const sub=actx.createOscillator(); sub.type='sine'; sub.frequency.value=freq/2;
  const sg=actx.createGain(); sg.gain.value=0.0001; sub.connect(sg); sg.connect(master);
  const a=0.012, d=Math.min(0.14,dur*0.35);
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(0.85,time+a);
  g.gain.exponentialRampToValueAtTime(0.22,time+a+d);
  g.gain.setValueAtTime(0.22,time+dur*0.72);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.97);
  sg.gain.setValueAtTime(0.0001,time);
  sg.gain.exponentialRampToValueAtTime(0.2,time+a+0.03);
  sg.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.9);
  o.start(time); o.stop(time+dur+0.02);
  sub.start(time); sub.stop(time+dur+0.02);
}
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('btnSound').textContent=soundOn?'🔊':'🔇';
  if(!actx) return;
  const now=actx.currentTime;
  master.gain.cancelScheduledValues(now);
  master.gain.setValueAtTime(Math.max(0.0001,master.gain.value),now);
  master.gain.exponentialRampToValueAtTime(soundOn?0.42:0.0001,now+0.4);
}

// ---------- boot ----------
const startEl=document.getElementById('start'), capEl=document.getElementById('cap');
function begin(){
  const nm=document.getElementById('nm').value.trim();
  capEl.textContent = nm || '';
  try{ localStorage.setItem('xmas_name',nm); }catch(e){}
  startEl.hidden=true;
  document.getElementById('ctrls').hidden=false;
  t0=performance.now(); started=true;
  if(RM){ t0=performance.now()-ASSEMBLE-200; for(const p of parts){p.sx=p.tx;p.sy=p.ty;} }
  if(soundOn){ try{ initAudio(); }catch(e){} }
}
function replay(){
  for(const p of parts){ p.sx=Math.random()*W; p.sy=Math.random()*H; }
  t0=performance.now();
  if(RM){ t0=performance.now()-ASSEMBLE-200; for(const p of parts){p.sx=p.tx;p.sy=p.ty;} }
}

document.getElementById('go').addEventListener('click',begin);
document.getElementById('nm').addEventListener('keydown',e=>{if(e.key==='Enter')begin();});
document.getElementById('btnSound').addEventListener('click',toggleSound);
document.getElementById('btnReplay').addEventListener('click',replay);
try{ const sv=localStorage.getItem('xmas_name'); if(sv) document.getElementById('nm').value=sv; }catch(e){}

window.addEventListener('resize',()=>{clearTimeout(window._rz); window._rz=setTimeout(resize,160);});

const img=new Image();
img.onload=()=>{ faceImg=img; resize(); };
img.onerror=()=>{ resize(); };
img.src=FACE_SRC;
resize();
requestAnimationFrame(loop);
</script>
