<title>글자 크리스마스 트리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Fullscreen night-sky canvas: letters assemble into a slowly rotating tree + 2 face baubles, with falling gifts and a santa hat. Committed dark world. */
  :root{
    --bg:#070b18; --bg2:#04060e; --ink:#e8eefc; --muted:#8fa0c4;
    --gold:#e8b84b; --panel:rgba(10,15,30,.72); --line:rgba(255,255,255,.14);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;
    background:radial-gradient(120% 90% at 50% 16%,#0d1430 0%,var(--bg) 45%,var(--bg2) 100%);
    color:var(--ink); font-family:"Space Grotesk",system-ui,sans-serif; overflow:hidden;
    -webkit-tap-highlight-color:transparent;}
  #stage{position:fixed; inset:0}
  canvas{display:block; width:100%; height:100%}
  .hud{position:fixed; top:env(safe-area-inset-top,0); left:0;
    padding:14px 0 0 max(16px,env(safe-area-inset-left,0px));
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; line-height:1.55;
    color:var(--muted); pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.6); z-index:4}
  .hud b{color:#cdd8f3; font-weight:500; font-variant-numeric:tabular-nums}
  .filebar{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    text-align:center; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--muted);
    pointer-events:none; z-index:4; letter-spacing:.3px}
  .filebar .dot{color:#3ddc84}
  .banner{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
    display:flex; justify-content:center; z-index:4; pointer-events:none;
    padding:0 max(16px,env(safe-area-inset-left,0px))}
  .words{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .word{display:flex; gap:5px}
  .word span{font-weight:700; font-size:clamp(14px,4.6vw,22px); letter-spacing:2px;
    width:1.5em; height:1.5em; display:grid; place-items:center; border-radius:6px;
    background:rgba(255,255,255,.05); color:#dfe7fb;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 3px 12px rgba(0,0,0,.4)}
  .word.g span{background:linear-gradient(180deg,#1f7d3f,#14532a); color:#dff6e6}
  .word.r span{background:linear-gradient(180deg,#b23a3a,#7a2626); color:#ffe4e1}
  .word.y span{background:linear-gradient(180deg,#d8a93f,#9c7420); color:#fff6df}
  .ctrls{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px);
    right:calc(env(safe-area-inset-right,0px) + 14px); display:flex; gap:10px; z-index:6}
  .ctrls button{width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer; backdrop-filter:blur(6px);
    display:grid; place-items:center; transition:transform .12s}
  .ctrls button:active{transform:scale(.9)}
  .ctrls button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .sndhint{position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 96px); z-index:5; pointer-events:none;
    font-size:13px; color:#cdd8f3; background:rgba(6,10,20,.6); border:1px solid var(--line);
    padding:8px 16px; border-radius:999px; backdrop-filter:blur(4px); text-align:center;
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
</style>

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
let parts=[], lights=[], orn=[], snow=[], bgStars=[], baubles=[];
let imgs={dog:null, woman:null};
let t0=0, started=false, elapsed=0;
const ASSEMBLE = RM ? 1 : 14000;
const ROT_PERIOD = 26000;           // 한 바퀴 도는 시간(ms) — 천천히

let treeCX,treeBaseY,treeTopY,treeHalf,faceR,treeFs;

function computeLayout(){
  treeCX=W*0.5; treeBaseY=H*0.865; treeTopY=H*0.385;
  treeHalf=Math.min(W*0.255,(treeBaseY-treeTopY)*0.42);
  faceR=Math.min(W*0.185,H*0.15,142);
  baubles=[
    {cx:W*0.205, cy:H*0.26, R:faceR, img:imgs.dog},
    {cx:W*0.795, cy:H*0.26, R:faceR, img:imgs.woman}
  ];
  treeFs=Math.max(10,Math.min(15,Math.round(Math.min(W,H)/52)));
}

const GREENS=[[52,170,84],[70,200,105],[38,140,66],[120,210,130],[26,120,52],[95,215,135],[46,158,80]];
const ORNHUE=[0,45,210,280,140,330,20];
const TREECH="@#%&$*oO0xX=+:^WMKAB8?svzHND";
const RAMP=" .,:;!=+*oxscnXMW8%@#";
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];

// 일반 입자(고정 좌표)
function makePart(tx,ty,ch,r,g,b,kind,delay,fs,fromTop){
  const sx = fromTop ? tx+rnd(-18,18) : Math.random()*W;
  const sy = fromTop ? ty-rnd(H*0.5,H*0.75) : Math.random()*H;
  return {tx,ty,sx,sy,ch,r:r|0,g:g|0,b:b|0,kind,delay,dur:1400+Math.random()*1300,fs,ph:Math.random()*6.28};
}
// 트리 입자(회전): ang/rad/y 로 매 프레임 x 계산
function makeTreePart(ang,rad,y,ch,r,g,b,delay,fs){
  return {ang,rad,y,sx:Math.random()*W,sy:Math.random()*H,ch,r:r|0,g:g|0,b:b|0,
    kind:'tree',delay,dur:1500+Math.random()*1400,fs,ph:Math.random()*6.28};
}

function buildTree(){
  const N=RM?700:1450;
  for(let k=0;k<N;k++){
    const u=Math.sqrt(Math.random());
    const y=treeTopY+(treeBaseY-treeTopY)*u;
    const t=(y-treeTopY)/(treeBaseY-treeTopY);
    const rad=treeHalf*t*Math.sqrt(Math.random());
    const ang=Math.random()*6.2832;
    let r,g,b,ch;
    if(Math.random()<0.10){const h=pick(ORNHUE); const c=hsl(h,80,60); r=c[0];g=c[1];b=c[2]; ch=pick("oO0*@%");}
    else{const c=pick(GREENS); const f=rnd(0.55,1.0); r=c[0]*f;g=c[1]*f;b=c[2]*f; ch=pick(TREECH);}
    const delay=300+(1-t)*3200+Math.random()*2600;
    parts.push(makeTreePart(ang,rad,y,ch,r,g,b,delay,treeFs));
  }
}

// 방울(장식공): 트리 표면에서 회전과 함께, 톡톡 생겨남
function buildOrnaments(){
  const n=RM?8:18;
  for(let k=0;k<n;k++){
    const t=rnd(0.2,0.95), y=treeTopY+(treeBaseY-treeTopY)*t;
    orn.push({ang:Math.random()*6.2832, y, half:treeHalf*t*0.98, hue:pick(ORNHUE),
      size:treeFs*rnd(0.7,1.0), delay:5200+Math.random()*3400, ph:Math.random()*6.28});
  }
}

// 선물상자: 위에서 떨어져 바닥에 쌓임
function buildGifts(){
  const specs=[[treeCX-treeHalf*0.6,treeHalf*0.46,[210,70,70],[245,205,90]],
               [treeCX+treeHalf*0.28,treeHalf*0.52,[90,140,235],[245,205,90]],
               [treeCX+treeHalf*0.82,treeHalf*0.38,[230,150,190],[235,235,245]]];
  let si=0;
  for(const [bx,bw,col,rib] of specs){
    const bh=bw*0.82, cell=Math.max(treeFs-1,9);
    const cols=Math.max(3,Math.round(bw/cell)), rows=Math.max(3,Math.round(bh/cell));
    const x0=bx-cols*cell/2, y0=treeBaseY+6;
    const midc=(cols/2)|0, midr=(rows/2)|0;
    const base=7000+si*700;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const ribbon=(i===midc||j===midr), c=ribbon?rib:col;
      const p=makePart(x0+i*cell+cell/2, y0+j*cell+cell/2, ribbon?'H':pick("#%&8"),
        c[0],c[1],c[2],'gift',base+Math.random()*1400,cell,true);
      parts.push(p);
    }
    si++;
  }
}

// 얼굴 방울(강아지/여자): 사진을 글자로
function buildFaceInto(img,cx,cy,R,delayBase){
  if(!img) return;
  const cell=Math.max(4,Math.round((2*R)/46));
  const NY=Math.max(24,Math.round(2*R/cell));
  const NX=Math.max(16,Math.round(NY*img.width/img.height));
  const oc=document.createElement('canvas'); oc.width=NX; oc.height=NY;
  const o=oc.getContext('2d'); o.drawImage(img,0,0,NX,NY);
  const d=o.getImageData(0,0,NX,NY).data;
  const cw=NX*cell, ch=NY*cell, x0=cx-cw/2, y0=cy-ch/2;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    const idx=(j*NX+i)*4, r=d[idx],g=d[idx+1],b=d[idx+2];
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    const px=x0+(i+0.5)*cell, py=y0+(j+0.5)*cell;
    const dx=px-cx, dy=py-cy;
    if(dx*dx+dy*dy>R*R*0.98) continue;
    if(lum<0.13) continue;
    const ci=Math.max(0,Math.min(RAMP.length-1,Math.floor(lum*(RAMP.length-1))));
    const norm=(py-(cy-R))/(2*R);
    const delay=delayBase+norm*3200+Math.random()*2400;
    parts.push(makePart(px,py,RAMP[ci],
      Math.min(255,r*1.14+30),Math.min(255,g*1.12+28),Math.min(255,b*1.1+30),'face',delay,cell,false));
  }
}

// 맨 위 산타 모자(빨간 고깔 + 흰 띠 + 방울)
function buildSantaHat(){
  // 트리 꼭대기에 얹히는 빨간 고깔 + 흰 띠 + 흰 방울(살짝 오른쪽으로 기움)
  const bx=treeCX, by=treeTopY+treeHalf*0.52;      // 띠(브림)가 트리 꼭대기에 살짝 겹침
  const hatH=treeHalf*1.12, baseW=treeHalf*0.74;
  const tipX=bx+treeHalf*0.32, tipY=by-hatH;
  const dx=tipX-bx, dy=tipY-by, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, px=-uy, py=ux;
  // 빨간 고깔 (브림 바로 위부터 끝까지)
  const N=RM?70:150;
  for(let k=0;k<N;k++){
    const f=0.08+Math.pow(Math.random(),0.85)*0.92;
    const cxp=bx+dx*f, cyp=by+dy*f, w=baseW*(1-f)*0.5;
    const off=(Math.random()*2-1)*w;
    parts.push(makePart(cxp+px*off, cyp+py*off, pick("#%&8@Wx"),
      rnd(195,228),rnd(44,70),rnd(44,70),'hat',10300+Math.random()*1700,treeFs,false));
  }
  // 흰 띠 (브림): 트리 꼭대기에 가로로 도톰하게
  for(let k=0;k<(RM?34:78);k++){
    const a=Math.random()*6.2832, rx=baseW*0.62, ry=treeFs*1.0;
    parts.push(makePart(bx+Math.cos(a)*rx, by+Math.sin(a)*ry*rnd(0.55,1.0),
      pick("oO0*8%@"), rnd(228,247),rnd(230,247),rnd(234,251),'hat',10000+Math.random()*1000,treeFs,false));
  }
  // 끝 방울 (폼폼)
  for(let k=0;k<(RM?18:40);k++){
    const a=Math.random()*6.2832, rr=Math.random()*treeFs*1.35;
    parts.push(makePart(tipX+Math.cos(a)*rr, tipY+Math.sin(a)*rr, pick("oO0*8%"),
      rnd(232,251),rnd(232,251),rnd(238,253),'hat',11200+Math.random()*800,treeFs,false));
  }
}

function buildLights(){
  const turns=5, n=RM?40:70;
  for(let k=0;k<n;k++){
    const f=k/(n-1), t=0.12+f*0.84, y=treeTopY+(treeBaseY-treeTopY)*t;
    lights.push({ang:f*turns*6.2832, y, half:treeHalf*t*0.9, hue:(k*47)%360, ph:Math.random()*6.28,
      delay:1400+(1-t)*2800+Math.random()*1400});
  }
}
function buildSnow(){ snow=[]; const n=RM?40:140;
  for(let k=0;k<n;k++) snow.push({x:Math.random()*W,y:Math.random()*H,r:rnd(0.7,2.4),sp:rnd(12,45),dr:rnd(-14,14),ph:Math.random()*6.28}); }
function buildBgStars(){ bgStars=[]; const n=Math.round(W*H/9000);
  for(let k=0;k<n;k++) bgStars.push({x:Math.random()*W,y:Math.random()*H*0.8,r:rnd(0.4,1.5),ph:Math.random()*6.28}); }

function buildScene(){
  parts=[]; lights=[]; orn=[];
  buildTree(); buildOrnaments(); buildLights();
  buildFaceInto(imgs.dog,  baubles[0].cx,baubles[0].cy,baubles[0].R, 5500);
  buildFaceInto(imgs.woman,baubles[1].cx,baubles[1].cy,baubles[1].R, 5500);
  buildGifts(); buildSantaHat();
}

function hsl(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l); const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]; }

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeLayout(); buildBgStars(); buildSnow();
  const was = started && elapsed>ASSEMBLE;
  buildScene();
  if(was || RM){ for(const p of parts){ if(p.kind!=='tree'){p.sx=p.tx;p.sy=p.ty;} } }
}

const easeOut=p=>1-Math.pow(1-p,3);
let lastFs=-1;
function drawParts(time,el,rot){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of parts){
    const lt=el-p.delay; if(lt<=0) continue;
    const pr=Math.min(1,lt/p.dur), e=easeOut(pr);
    let tx,ty,depthA=1;
    if(p.kind==='tree'){
      const cosv=Math.cos(p.ang+rot);
      tx=treeCX+Math.sin(p.ang+rot)*p.rad; ty=p.y;
      depthA=0.42+0.58*((cosv+1)/2);
    } else { tx=p.tx; ty=p.ty; }
    let x=p.sx+(tx-p.sx)*e, y=p.sy+(ty-p.sy)*e, a=pr;
    if(pr>=1){
      if(p.kind==='face') a=0.9+0.1*Math.sin(time*0.0035+p.ph);
      else if(p.kind==='hat') a=0.9+0.1*Math.sin(time*0.004+p.ph);
      else if(p.kind==='gift') a=0.92+0.08*Math.sin(time*0.004+p.ph);
      else a=(0.82+0.18*Math.sin(time*0.004+p.ph))*depthA;
    } else if(p.kind==='tree') a*=depthA;
    if(p.fs!==lastFs){ ctx.font=p.fs+'px ui-monospace,Menlo,monospace'; lastFs=p.fs; }
    ctx.fillStyle='rgba('+(p.r|0)+','+(p.g|0)+','+(p.b|0)+','+a.toFixed(3)+')';
    ctx.fillText(p.ch,x,y);
  }
}

function drawOrnaments(time,el,rot){
  for(const o of orn){
    const lt=el-o.delay; if(lt<=0) continue;
    const cosv=Math.cos(o.ang+rot); if(cosv<-0.25) continue;
    const sc=easeOut(Math.min(1,lt/600));
    const x=treeCX+Math.sin(o.ang+rot)*o.half, y=o.y, R=o.size*sc;
    const front=0.45+0.55*((cosv+1)/2), c=hsl(o.hue,85,58);
    ctx.globalAlpha=front;
    ctx.shadowColor='hsl('+o.hue+',90%,55%)'; ctx.shadowBlur=7;
    ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
    ctx.beginPath(); ctx.arc(x,y,R,0,6.2832); ctx.fill();
    ctx.shadowBlur=0;
    ctx.globalAlpha=front*0.85; ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(x-R*0.3,y-R*0.33,R*0.28,0,6.2832); ctx.fill();
  }
  ctx.globalAlpha=1;
}

let litCount=0;
function drawLights(time,el,rot){
  ctx.save(); let lit=0;
  for(const L of lights){
    const lt=el-L.delay; if(lt<=0) continue;
    const cosv=Math.cos(L.ang+rot); if(cosv<-0.3) continue; lit++;
    const fin=Math.min(1,lt/900), tw=0.4+0.6*Math.max(0,Math.sin(time*0.005+L.ph));
    const front=0.4+0.6*((cosv+1)/2);
    ctx.globalAlpha=fin*(0.3+0.7*tw)*front;
    ctx.fillStyle='hsl('+L.hue+',90%,'+(58+tw*14)+'%)';
    ctx.shadowColor='hsl('+L.hue+',95%,60%)'; ctx.shadowBlur=8+tw*8;
    ctx.beginPath(); ctx.arc(treeCX+Math.sin(L.ang+rot)*L.half, L.y, 1.7+tw*1.5,0,6.2832); ctx.fill();
  }
  ctx.restore(); litCount=lit;
}

function drawBaubles(time,el){
  for(const B of baubles){
    if(!B.img) continue;
    const rev=Math.min(1,Math.max(0,(el-5200)/4500)); if(rev<=0) continue;
    ctx.save();
    ctx.globalAlpha=0.5*rev; ctx.strokeStyle='rgba(200,215,255,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(B.cx,B.cy-B.R); ctx.lineTo(B.cx,Math.max(0,B.cy-B.R-H*0.08)); ctx.stroke();
    const g=ctx.createRadialGradient(B.cx,B.cy,B.R*0.2,B.cx,B.cy,B.R*1.08);
    g.addColorStop(0,'rgba(30,52,86,'+(0.5*rev)+')');
    g.addColorStop(0.7,'rgba(16,28,52,'+(0.4*rev)+')');
    g.addColorStop(1,'rgba(10,16,34,0)');
    ctx.globalAlpha=1; ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(B.cx,B.cy,B.R*1.08,0,6.2832); ctx.fill();
    for(let i=0;i<56;i++){
      const an=i/56*6.2832, tw=0.45+0.55*Math.sin(time*0.004+i*0.6);
      ctx.globalAlpha=rev*(0.3+0.6*tw); ctx.fillStyle='rgba(190,215,255,0.9)';
      ctx.beginPath(); ctx.arc(B.cx+Math.cos(an)*B.R*1.06, B.cy+Math.sin(an)*B.R*1.06, 1.3,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=rev; ctx.fillStyle='rgba(232,184,75,.9)';
    ctx.beginPath(); ctx.arc(B.cx,B.cy-B.R,3.2,0,6.2832); ctx.fill();
    ctx.restore();
  }
}

function drawSnow(time,dt){
  ctx.save(); ctx.fillStyle='#fff';
  for(const s of snow){
    s.y+=s.sp*dt; s.x+=Math.sin(time*0.001+s.ph)*s.dr*dt;
    if(s.y>H+4){s.y=-4; s.x=Math.random()*W;}
    if(s.x<-4)s.x=W+4; if(s.x>W+4)s.x=-4;
    ctx.globalAlpha=0.5+0.4*Math.sin(time*0.003+s.ph);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.2832); ctx.fill();
  }
  ctx.restore();
}
function drawBgStars(time){
  ctx.save(); ctx.fillStyle='#dfe8ff';
  for(const st of bgStars){
    ctx.globalAlpha=0.25+0.55*Math.abs(Math.sin(time*0.002+st.ph));
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

const sRot=document.getElementById('sRot'), sLit=document.getElementById('sLit'), sLet=document.getElementById('sLet');
function updateHud(el){
  sRot.textContent=((el/ROT_PERIOD*360)%360).toFixed(2);
  sLit.textContent=litCount;
  let n=0; for(const p of parts) if(el>p.delay) n++;
  sLet.textContent=n.toLocaleString();
}

let prevTs=0;
function render(ts){
  const dt=Math.min(0.05,(ts-prevTs)/1000)||0.016; prevTs=ts;
  elapsed = started ? ts-t0 : 0;
  const rot = elapsed/ROT_PERIOD*6.2832;
  ctx.clearRect(0,0,W,H);
  drawBgStars(ts);
  if(started){
    drawBaubles(ts,elapsed);
    drawParts(ts,elapsed,rot);
    drawOrnaments(ts,elapsed,rot);
    drawLights(ts,elapsed,rot);
  }
  drawSnow(ts,dt);
  if(started) updateHud(elapsed);
}
let lastFrame=0;
function loop(ts){ requestAnimationFrame(loop); if(ts-lastFrame<30) return; lastFrame=ts; render(ts); }

// ---------- audio: Jingle Bells ----------
const F={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.0,A4:440.0,B4:493.88,C5:523.25};
const SONG=[
 ['E4',1],['E4',1],['E4',2], ['E4',1],['E4',1],['E4',2],
 ['E4',1],['G4',1],['C4',1],['D4',1], ['E4',4],
 ['F4',1],['F4',1],['F4',1],['F4',1], ['F4',1],['E4',1],['E4',1],['E4',0.5],['E4',0.5],
 ['E4',1],['D4',1],['D4',1],['E4',1], ['D4',2],['G4',2],
 ['E4',1],['E4',1],['E4',2], ['E4',1],['E4',1],['E4',2],
 ['E4',1],['G4',1],['C4',1],['D4',1], ['E4',4],
 ['F4',1],['F4',1],['F4',1],['F4',1], ['F4',1],['E4',1],['E4',1],['E4',0.5],['E4',0.5],
 ['G4',1],['G4',1],['F4',1],['D4',1], ['C4',4]
];
const BEAT=60/116;
let actx=null, master=null, seqIdx=0, nextTime=0, schedTimer=null, soundOn=true;
function initAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.0001; master.connect(actx.destination);
    master.gain.setValueAtTime(0.0001,actx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.42,actx.currentTime+1.6);
    nextTime=actx.currentTime+0.2; seqIdx=0;
    schedTimer=setInterval(scheduler,25);
  }catch(e){ actx=null; }
}
function scheduler(){
  if(!actx || actx.state!=='running') return;
  while(nextTime<actx.currentTime+0.14){
    const [nm,b]=SONG[seqIdx], dur=b*BEAT;
    if(nm) playNote(F[nm],nextTime,dur);
    nextTime+=dur; seqIdx=(seqIdx+1)%SONG.length;
  }
}
function playNote(freq,time,dur){
  const g=actx.createGain(); g.connect(master);
  const o=actx.createOscillator(); o.type='triangle'; o.frequency.value=freq; o.connect(g);
  const sub=actx.createOscillator(); sub.type='sine'; sub.frequency.value=freq/2;
  const sg=actx.createGain(); sg.gain.value=0.0001; sub.connect(sg); sg.connect(master);
  const a=0.012, d=Math.min(0.14,dur*0.35);
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(0.85,time+a);
  g.gain.exponentialRampToValueAtTime(0.22,time+a+d);
  g.gain.setValueAtTime(0.22,time+dur*0.72);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.97);
  sg.gain.setValueAtTime(0.0001,time);
  sg.gain.exponentialRampToValueAtTime(0.2,time+a+0.03);
  sg.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.9);
  o.start(time); o.stop(time+dur+0.02); sub.start(time); sub.stop(time+dur+0.02);
}
const sndHint=document.getElementById('sndHint');
function refreshHint(){ sndHint.hidden = !(soundOn && (!actx || actx.state!=='running')); }
function tryResumeAudio(){
  if(!actx) initAudio();
  if(actx && actx.state!=='running'){ actx.resume().then(()=>{nextTime=actx.currentTime+0.1; refreshHint();}).catch(()=>{}); }
  refreshHint();
}
window.__pauseAudio=function(){ try{ if(actx && actx.state==='running') actx.suspend(); }catch(e){} };
window.__resumeAudio=function(){ try{ if(actx && soundOn && actx.state!=='running'){ actx.resume().then(()=>{nextTime=actx.currentTime+0.1;}); } }catch(e){} refreshHint(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden) window.__pauseAudio(); else window.__resumeAudio(); });
window.addEventListener('pagehide',()=>window.__pauseAudio());
function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('btnSound').textContent=soundOn?'🔊':'🔇';
  if(!actx){ if(soundOn) tryResumeAudio(); return; }
  if(soundOn) actx.resume().then(()=>{nextTime=actx.currentTime+0.1;}).catch(()=>{});
  else actx.suspend().catch(()=>{});
  refreshHint();
}

// ---------- boot ----------
function start(){
  if(started) return;
  started=true; t0=performance.now();
  if(RM){ t0=performance.now()-ASSEMBLE-200; for(const p of parts){ if(p.kind!=='tree'){p.sx=p.tx;p.sy=p.ty;} } }
  initAudio(); setTimeout(refreshHint,700);
  const once=()=>tryResumeAudio();
  window.addEventListener('pointerdown',once,{passive:true});
  window.addEventListener('touchstart',once,{passive:true});
  window.addEventListener('keydown',once);
}
function replay(){
  for(const p of parts){ if(p.kind==='tree'){p.sx=Math.random()*W;p.sy=Math.random()*H;} else {p.sx=(p.kind==='gift')?p.tx+rnd(-18,18):Math.random()*W; p.sy=(p.kind==='gift')?p.ty-rnd(H*0.5,H*0.75):Math.random()*H;} }
  t0=performance.now();
  if(RM){ t0=performance.now()-ASSEMBLE-200; for(const p of parts){ if(p.kind!=='tree'){p.sx=p.tx;p.sy=p.ty;} } }
}
document.getElementById('btnSound').addEventListener('click',toggleSound);
document.getElementById('btnReplay').addEventListener('click',replay);
if (window.AndroidApp){ const u=document.getElementById('btnUpd'); u.hidden=false;
  u.addEventListener('click',()=>{ try{ window.AndroidApp.checkUpdate(); }catch(e){} }); }
window.addEventListener('resize',()=>{clearTimeout(window._rz); window._rz=setTimeout(resize,160);});

let pending=2;
function imgDone(){ pending--; if(pending<=0){ resize(); start(); } }
function loadImg(src,key){ const im=new Image(); im.onload=()=>{imgs[key]=im; imgDone();}; im.onerror=imgDone; im.src=src; }
resize(); requestAnimationFrame(loop);
loadImg(FACE_DOG,'dog'); loadImg(FACE_WOMAN,'woman');
</script>
