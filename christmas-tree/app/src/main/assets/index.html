<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글자 크리스마스 트리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Fullscreen night-sky canvas: letters assemble into a slowly rotating tree + 2 face baubles, with falling gifts and a santa hat. Committed dark world. */
  :root{
    --bg:#070b18; --bg2:#04060e; --ink:#e8eefc; --muted:#8fa0c4;
    --gold:#e8b84b; --panel:rgba(10,15,30,.72); --line:rgba(255,255,255,.14);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;
    background:radial-gradient(120% 90% at 50% 16%,#0d1430 0%,var(--bg) 45%,var(--bg2) 100%);
    color:var(--ink); font-family:"Space Grotesk",system-ui,sans-serif; overflow:hidden;
    -webkit-tap-highlight-color:transparent;}
  #stage{position:fixed; inset:0}
  canvas{display:block; width:100%; height:100%}
  .hud{position:fixed; top:env(safe-area-inset-top,0); left:0;
    padding:14px 0 0 max(16px,env(safe-area-inset-left,0px));
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; line-height:1.55;
    color:var(--muted); pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.6); z-index:4}
  .hud b{color:#cdd8f3; font-weight:500; font-variant-numeric:tabular-nums}
  .filebar{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
    text-align:center; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--muted);
    pointer-events:none; z-index:4; letter-spacing:.3px}
  .filebar .dot{color:#3ddc84}
  .banner{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 32px);
    display:flex; justify-content:center; z-index:4; pointer-events:none;
    padding:0 max(16px,env(safe-area-inset-left,0px))}
  .words{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .word{display:flex; gap:5px}
  .word span{font-weight:700; font-size:clamp(14px,4.6vw,22px); letter-spacing:2px;
    width:1.5em; height:1.5em; display:grid; place-items:center; border-radius:6px;
    background:rgba(255,255,255,.05); color:#dfe7fb;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), 0 3px 12px rgba(0,0,0,.4)}
  .word.g span{background:linear-gradient(180deg,#1f7d3f,#14532a); color:#dff6e6}
  .word.r span{background:linear-gradient(180deg,#b23a3a,#7a2626); color:#ffe4e1}
  .word.y span{background:linear-gradient(180deg,#d8a93f,#9c7420); color:#fff6df}
  .ctrls{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px);
    right:calc(env(safe-area-inset-right,0px) + 14px); display:flex; gap:10px; z-index:6}
  .ctrls button{width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer; backdrop-filter:blur(6px);
    display:grid; place-items:center; transition:transform .12s}
  .ctrls button:active{transform:scale(.9)}
  .ctrls button:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .sndhint{position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 96px); z-index:5; pointer-events:none;
    font-size:13px; color:#cdd8f3; background:rgba(6,10,20,.6); border:1px solid var(--line);
    padding:8px 16px; border-radius:999px; backdrop-filter:blur(4px); text-align:center;
    animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
  .topc{position:fixed; top:calc(env(safe-area-inset-top,0px) + 62px); left:0; right:0; z-index:4;
    pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:0 16px}
  .cd{font-size:12.5px; letter-spacing:.4px; color:#ffe6ac; background:rgba(6,10,20,.42);
    border:1px solid var(--line); padding:5px 14px; border-radius:999px; backdrop-filter:blur(4px);
    text-shadow:0 1px 3px rgba(0,0,0,.5); font-variant-numeric:tabular-nums}
  .np{font-size:12.5px; color:#d4e6ff; background:rgba(6,10,20,.42); border:1px solid var(--line);
    padding:5px 14px; border-radius:999px; backdrop-filter:blur(4px); opacity:0; transition:opacity .6s}
  .updtl{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px);
    left:calc(env(safe-area-inset-left,0px) + 14px); z-index:6; width:34px; height:34px;
    border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--ink);
    font-size:15px; cursor:pointer; backdrop-filter:blur(6px); display:grid; place-items:center}
  .updtl:active{transform:scale(.9)}
  /* ── 릴스: 코드 에디터 + 터미널 HUD ── */
  .timer{position:fixed; top:calc(env(safe-area-inset-top,0px) + 13px); right:calc(env(safe-area-inset-right,0px) + 16px);
    z-index:5; font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--gold);
    letter-spacing:.3px; text-shadow:0 1px 3px rgba(0,0,0,.6); font-variant-numeric:tabular-nums; pointer-events:none}
  .stats{position:fixed; left:calc(env(safe-area-inset-left,0px) + 16px); bottom:calc(38% + 12px);
    z-index:4; pointer-events:none; font-family:ui-monospace,Menlo,monospace; font-size:11px;
    color:var(--muted); line-height:1.55; text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .stats .handle{color:#7fa8ff; font-size:12px; margin-bottom:3px}
  .stats b{color:#cdd8f3; font-weight:500; font-variant-numeric:tabular-nums}
  .codepanel{position:fixed; left:0; right:0; bottom:0; height:38%; z-index:3; overflow:hidden;
    background:#0b0f1a; border-top:1px solid rgba(255,255,255,.08); font-family:ui-monospace,Menlo,monospace}
  .codebar{display:flex; align-items:center; justify-content:space-between; height:30px;
    padding:0 14px; background:#0e1320; border-bottom:1px solid rgba(255,255,255,.06); font-size:11.5px; color:#8fa0c4}
  .codebar .fname{color:#cdd8f3}
  .codebar .run{display:flex; align-items:center; gap:7px}
  .codebar .run i{width:7px; height:7px; border-radius:50%; background:#3ddc84; box-shadow:0 0 6px #3ddc84; animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.35}}
  .codebody{position:absolute; top:30px; left:0; right:0; bottom:0; overflow:hidden}
  #code{margin:0; padding:6px 0 6px 8px; font-size:11px; line-height:1.5; color:#9fb0cf; white-space:pre; animation:scroll 46s linear infinite}
  @media (prefers-reduced-motion:reduce){ #code{animation:none} }
  @keyframes scroll{from{transform:translateY(0)} to{transform:translateY(-50%)}}
  #code .ln{display:inline-block; width:26px; color:#44506b; text-align:right; margin-right:12px}
  #code b{font-weight:400}
  #code .k{color:#c792ea} #code .s{color:#7fd88f} #code .n{color:#f78c6c} #code .c{color:#5a6785; font-style:italic}
</style>

<div id="stage"><canvas id="c"></canvas></div>
<button class="updtl" id="btnUpdTL" title="업데이트 확인" hidden>⬆</button>
<div class="ctrls">
  <button id="btnTheme" title="테마 바꾸기">🎨</button>
  <button id="btnSound" title="소리">🔊</button>
  <button id="btnReplay" title="다시">↻</button>
</div>
<div class="topc">
  <div class="np" id="np"></div>
</div>

// 일반 입자(고정 좌표)
function makePart(tx,ty,ch,r,g,b,kind,delay,fs,fromTop){
  const sx = fromTop ? tx+rnd(-18,18) : Math.random()*W;
  const sy = fromTop ? ty-rnd(H*0.5,H*0.75) : Math.random()*H;
  return {tx,ty,sx,sy,ch,r:r|0,g:g|0,b:b|0,kind,delay,dur:1400+Math.random()*1300,fs,ph:Math.random()*6.28};
}
// 트리 입자(회전): ang/rad/y 로 매 프레임 x 계산
function makeTreePart(ang,rad,y,ch,r,g,b,delay,fs){
  return {ang,rad,y,sx:Math.random()*W,sy:Math.random()*H,ch,r:r|0,g:g|0,b:b|0,
    kind:'tree',delay,dur:1500+Math.random()*1400,fs,ph:Math.random()*6.28};
}

// 3단 치마(계단형) 트리 프로필: t=0(꼭대기)~1(바닥)
const TIER_TOP=[0.0,0.26,0.52], TIER_BASE=[0.38,0.68,1.0];
function tierHalf(t){
  const ti=Math.min(2,Math.floor(t*3)), lt=t*3-ti;
  return TIER_TOP[ti]+(TIER_BASE[ti]-TIER_TOP[ti])*lt;
}
function buildTree(){
  const N=RM?700:1600;
  for(let k=0;k<N;k++){
    const u=Math.sqrt(Math.random());
    const y=treeTopY+(treeBaseY-treeTopY)*u;
    const t=(y-treeTopY)/(treeBaseY-treeTopY);
    const rad=treeHalf*tierHalf(t)*Math.sqrt(Math.random());
    const ang=Math.random()*6.2832;
    let r,g,b,ch;
    if(Math.random()<0.10){const h=pick(TH.ornHue); const c=hsl(h,80,60); r=c[0];g=c[1];b=c[2]; ch=pick(TREECH);}
    else{const c=pick(TH.tree); const f=rnd(0.55,1.0); r=c[0]*f;g=c[1]*f;b=c[2]*f; ch=pick(TREECH);}
    const delay=300+(1-t)*3200+Math.random()*2600;
    parts.push(makeTreePart(ang,rad,y,ch,r,g,b,delay,treeFs));
  }
}

// 방울(장식공): 트리 표면에서 회전과 함께, 톡톡 생겨남
function buildOrnaments(){
  const n=RM?8:18;
  for(let k=0;k<n;k++){
    const t=rnd(0.2,0.95), y=treeTopY+(treeBaseY-treeTopY)*t;
    orn.push({ang:Math.random()*6.2832, y, half:treeHalf*tierHalf(t)*0.96, hue:pick(TH.ornHue),
      size:treeFs*rnd(0.7,1.0), delay:5200+Math.random()*3400, ph:Math.random()*6.28});
  }
}

// 🎁 선물상자: 위에서 통통 떨어져 바닥에 쌓이고, 탭하면 열림
function buildGifts(){
  gifts=[];
  // 모던 뮤트 팔레트 (세이지/테라코타/더스티블루/머스터드/모브)
  const cols=[[139,168,136],[201,123,99],[125,155,181],[223,194,120],[193,135,163]];
  const n=RM?3:5;
  for(let i=0;i<n;i++){
    const w=treeHalf*rnd(0.36,0.5), h=w*rnd(0.78,0.9);
    const frac=(i+0.5)/n, cx=treeCX+(frac-0.5)*treeHalf*1.65;
    const y=treeBaseY - h + rnd(2,10);
    gifts.push({x:cx-w/2, y, w, h, col:cols[i%cols.length], rib:[240,235,224],
      delay:7000+i*420+rnd(0,500), dur:1100, startY:(treeBaseY-h)-rnd(H*0.5,H*0.72),
      open:0, openT:-9999});
  }
}
const easeOutBounce=p=>{ const n1=7.5625,d1=2.75;
  if(p<1/d1) return n1*p*p;
  if(p<2/d1){ p-=1.5/d1; return n1*p*p+0.75; }
  if(p<2.5/d1){ p-=2.25/d1; return n1*p*p+0.9375; }
  p-=2.625/d1; return n1*p*p+0.984375; };
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawGifts(el,ts){
  for(const g of gifts){
    const lt=el-g.delay; if(lt<=0) continue;
    const p=Math.min(1,lt/g.dur), e=easeOutBounce(p);
    const y=g.startY+(g.y-g.startY)*e;
    if(g.open && ts-g.openT>2600) g.open=0;
    const openP=g.open?Math.min(1,(ts-g.openT)/350):0;
    const x=g.x,w=g.w,h=g.h,c=g.col,rib=g.rib, r=Math.min(9,w*0.14);
    ctx.save();
    // 부드러운 그림자
    ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(x+w/2,y+h+3,w*0.46,3.5,0,0,6.2832); ctx.fill();
    // 몸통(플랫 + 살짝 톤)
    const bg=ctx.createLinearGradient(0,y+h*0.22,0,y+h);
    bg.addColorStop(0,rgb(lighten(c,10))); bg.addColorStop(1,rgb(c));
    ctx.fillStyle=bg; rr(x,y+h*0.22,w,h*0.78,r); ctx.fill();
    // 얇은 세로 리본
    ctx.fillStyle=rgb(rib); ctx.fillRect(x+w*0.45,y+h*0.22,w*0.1,h*0.78);
    // 뚜껑(열리면 위로 들림)
    const lcx=x+w/2, lcy=y+h*0.12-openP*h*0.58;
    ctx.save(); ctx.translate(lcx,lcy); ctx.rotate(-openP*0.16);
    ctx.fillStyle=rgb(lighten(c,16)); rr(-w*0.54,-h*0.12,w*1.08,h*0.22,r*0.8); ctx.fill();
    ctx.fillStyle=rgb(rib); ctx.fillRect(-w*0.05,-h*0.12,w*0.1,h*0.22);
    // 미니멀 매듭(얇은 고리 + 작은 점)
    ctx.strokeStyle=rgb(rib); ctx.lineWidth=Math.max(1.5,w*0.035); ctx.lineCap='round';
    ctx.beginPath(); ctx.ellipse(-w*0.1,-h*0.17,w*0.08,h*0.05,0.5,0,6.2832); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(w*0.1,-h*0.17,w*0.08,h*0.05,-0.5,0,6.2832); ctx.stroke();
    ctx.fillStyle=rgb(rib); ctx.beginPath(); ctx.arc(0,-h*0.13,w*0.05,0,6.2832); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
}
function giftAt(mx,my,el){
  for(const g of gifts){ if(el<=g.delay+g.dur*0.8) continue;
    if(mx>=g.x-4 && mx<=g.x+g.w+4 && my>=g.y-g.h*0.4 && my<=g.y+g.h) return g; }
  return null;
}
function openGift(g,ts){
  if(g.open && ts-g.openT<2500) return;
  g.open=1; g.openT=ts;
  spawnHearts(g.x+g.w/2, g.y); spawnFirework(g.x+g.w/2, g.y-18, null);
}

// ✨ 효과 입자 (하트 / 반짝 / 폭죽)
function spawnHearts(x,y){
  for(let i=0;i<16;i++){ const a=-Math.PI/2+rnd(-0.9,0.9), sp=rnd(120,320);
    fx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(40,120),life:0,max:rnd(1.0,1.8),g:340,
      type:'heart',col:[255,(90+Math.random()*70)|0,(130+Math.random()*60)|0],size:rnd(9,16)}); }
  for(let i=0;i<12;i++){ const a=rnd(0,6.2832), sp=rnd(80,240);
    fx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rnd(0.6,1.1),g:120,type:'spark',
      col:[255,230,150],size:rnd(1.5,3)}); }
}
function spawnFirework(x,y,hue){
  const n=RM?20:38, base=hue==null?rnd(0,360):hue;
  for(let i=0;i<n;i++){ const a=i/n*6.2832+rnd(-0.08,0.08), sp=rnd(120,300);
    const c=hsl((base+rnd(-25,25)+360)%360,90,62);
    fx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rnd(0.9,1.6),g:95,type:'spark',
      col:c,size:rnd(1.7,3.2),glow:true}); }
}
function drawHeart(x,y,s,col,a){
  ctx.save(); ctx.translate(x,y); ctx.scale(s/16,s/16);
  ctx.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+a.toFixed(3)+')';
  ctx.beginPath(); ctx.moveTo(0,4);
  ctx.bezierCurveTo(0,-2,-8,-2,-8,3); ctx.bezierCurveTo(-8,8,0,12,0,14);
  ctx.bezierCurveTo(0,12,8,8,8,3); ctx.bezierCurveTo(8,-2,0,-2,0,4);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function updDrawFx(ts,dt){
  ctx.save();
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.life+=dt; f.vy+=f.g*dt; f.x+=f.vx*dt; f.y+=f.vy*dt;
    const t=f.life/f.max; if(t>=1){ fx.splice(i,1); continue; }
    const a=1-t;
    if(f.type==='heart'){ drawHeart(f.x,f.y,f.size,f.col,a); }
    else { ctx.globalAlpha=a; ctx.fillStyle='rgb('+f.col[0]+','+f.col[1]+','+f.col[2]+')';
      if(f.glow){ ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8; }
      ctx.beginPath(); ctx.arc(f.x,f.y,f.size,0,6.2832); ctx.fill(); ctx.shadowBlur=0; }
  }
  ctx.globalAlpha=1; ctx.restore();
}
// 🌨️ 바닥에 눈 쌓이기
let snowBank=0;
function drawSnowBank(dt){
  snowBank=Math.min(H*0.1, snowBank+dt*3.4);   // 더 높이, 천천히 점점 쌓임
  if(snowBank<1) return;
  ctx.save();
  // 눈밭 (두 겹 물결로 자연스러운 눈더미)
  const top=x=>H-snowBank*(0.6+0.26*Math.sin(x*0.016+1)+0.12*Math.sin(x*0.047+0.6));
  ctx.fillStyle='rgba(224,233,248,0.96)';
  ctx.beginPath(); ctx.moveTo(0,H+2);
  for(let x=0;x<=W;x+=18) ctx.lineTo(x,top(x)+3);
  ctx.lineTo(W,H+2); ctx.closePath(); ctx.fill();
  // 윗면 밝은 하이라이트
  ctx.fillStyle='rgba(248,251,255,0.98)';
  ctx.beginPath(); ctx.moveTo(0,H+2);
  for(let x=0;x<=W;x+=18) ctx.lineTo(x,top(x));
  for(let x=W;x>=0;x-=18) ctx.lineTo(x,top(x)+5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
// 🔥 벽난로 + 🧦 양말 (좌측 하단)
function drawStocking(cx,topY,s,col,ts,i){

  rr(-s*0.42,s*1.18,s*1.3,s*0.58,s*0.33); ctx.fill();       // 발
  ctx.fillStyle='#f2f4f8'; rr(-s*0.48,-s*0.1,s*0.96,s*0.36,s*0.16); ctx.fill(); // 크림 접단

}
function roundClip(x,y,w,h,r){ rr(x,y,w,h,r); ctx.clip(); }
// 🔥 모던/플랫 벽난로
function drawFireplace(ts,el){
  const fade=Math.min(1,Math.max(0,(el-6000)/2500)); if(fade<=0) return;
  const w=Math.min(W*0.25,118), h=w*0.95;
  const baseY=H-(snowBank||0)*0.5-6, x=Math.max(10,W*0.03), y=baseY-h;
  const ox=x+w*0.18, ow=w*0.64, oy=y+h*0.32, oh=h*0.58, fby=oy+oh, fcx=ox+ow/2, orad=Math.min(12,ow*0.2);
  ctx.save(); ctx.globalAlpha=fade;
  // 바닥 불빛(은은)
  const spill=ctx.createRadialGradient(fcx,fby,4,fcx,baseY,w*0.95);
  spill.addColorStop(0,'rgba(255,170,90,0.2)'); spill.addColorStop(1,'rgba(255,130,60,0)');
  ctx.fillStyle=spill; ctx.beginPath(); ctx.ellipse(fcx,baseY,w*0.9,h*0.4,0,0,6.2832); ctx.fill();
  // 프레임(플랫 차콜, 라운드)
  const bg=ctx.createLinearGradient(0,y,0,y+h); bg.addColorStop(0,'#4e463f'); bg.addColorStop(1,'#39332d');
  ctx.fillStyle=bg; rr(x,y,w,h,16); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.045)'; rr(x,y,w,h*0.42,16); ctx.fill();
  // 선반(얇고 깔끔)
  ctx.fillStyle='#5a524a'; rr(x-7,y-9,w+14,11,6); ctx.fill();
  ctx.fillStyle='rgba(255,246,235,0.1)'; rr(x-7,y-9,w+14,3,6); ctx.fill();
  // 아궁이(라운드)
  ctx.fillStyle='#1b1712'; rr(ox,oy,ow,oh,orad); ctx.fill();
  ctx.save(); rr(ox,oy,ow,oh,orad); ctx.clip();
  const fg=ctx.createRadialGradient(fcx,fby,2,fcx,fby,ow*0.95);
  fg.addColorStop(0,'rgba(255,198,112,0.95)'); fg.addColorStop(0.42,'rgba(255,142,70,0.55)'); fg.addColorStop(1,'rgba(255,100,50,0)');
  ctx.fillStyle=fg; ctx.fillRect(ox,oy,ow,oh);
  for(let i=0;i<3;i++){ const bx=fcx+(i-1)*ow*0.24, fl=oh*0.5*(0.6+0.4*Math.abs(Math.sin(ts*0.005+i*1.5))), fw=ow*0.22;
    const lg=ctx.createLinearGradient(0,fby,0,fby-fl); lg.addColorStop(0,'rgba(255,214,140,0.92)'); lg.addColorStop(1,'rgba(255,150,80,0)');
    ctx.fillStyle=lg; ctx.beginPath(); ctx.moveTo(bx-fw/2,fby); ctx.quadraticCurveTo(bx,fby-fl*0.85,bx,fby-fl); ctx.quadraticCurveTo(bx,fby-fl*0.85,bx+fw/2,fby); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#3a2a1c'; rr(ox+ow*0.18,fby-4,ow*0.64,4,2); ctx.fill();
  ctx.restore();
  // 양말 2개(모던 뮤트)
  const cols=[[197,123,99],[139,168,136]];
  for(let i=0;i<2;i++) drawStocking(x+w*(0.33+i*0.34), y-6, w*0.1, cols[i], ts, i);
  ctx.restore();
}
// ⛄ 모던/플랫 눈사람 (우측 하단)
function drawSnowman(ts,el){
  const fade=Math.min(1,Math.max(0,(el-6500)/2500)); if(fade<=0) return;
  const u=Math.min(W*0.052,22);
  const baseY=H-(snowBank||0)*0.5-4, cx=W-Math.max(12,W*0.04)-u*1.3;
  const bob=Math.sin(ts*0.0016)*1.2;
  const botY=baseY-u*1.25+bob, midY=botY-u*1.95, headY=midY-u*1.4;
  ctx.save(); ctx.globalAlpha=fade;
  ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(cx,baseY+2,u*1.45,u*0.38,0,0,6.2832); ctx.fill();
  const body=(x,y,r)=>{ const g=ctx.createRadialGradient(x-r*0.32,y-r*0.34,r*0.2,x,y,r);
    g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#d2dced'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); };
  body(cx,botY,u*1.25); body(cx,midY,u*0.95); body(cx,headY,u*0.7);
  // 팔(얇고 미니멀)
  ctx.strokeStyle='#8a7258'; ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx-u*0.85,midY-u*0.15); ctx.lineTo(cx-u*1.95,midY-u*0.85); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+u*0.85,midY-u*0.15); ctx.lineTo(cx+u*1.95,midY-u*0.9); ctx.stroke();
  // 단추(차콜)
  ctx.fillStyle='#4a4f59'; for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(cx,midY-u*0.45+i*u*0.48,u*0.09,0,6.2832); ctx.fill(); }
  // 목도리(테라코타)
  ctx.fillStyle='#c97b63'; rr(cx-u*0.68,headY+u*0.52,u*1.36,u*0.3,u*0.14); ctx.fill();
  ctx.fillStyle='#b26a53'; rr(cx+u*0.18,headY+u*0.72,u*0.3,u*0.85,u*0.1); ctx.fill();
  // 눈 / 코
  ctx.fillStyle='#2e2a28';
  ctx.beginPath(); ctx.arc(cx-u*0.24,headY-u*0.08,u*0.09,0,6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+u*0.24,headY-u*0.08,u*0.09,0,6.2832); ctx.fill();
  ctx.fillStyle='#e09150'; ctx.beginPath(); ctx.moveTo(cx,headY+u*0.02); ctx.lineTo(cx+u*0.62,headY+u*0.14); ctx.lineTo(cx,headY+u*0.2); ctx.closePath(); ctx.fill();
  // 모자(차콜 + 세이지 밴드)
  ctx.fillStyle='#2e2a28'; rr(cx-u*0.82,headY-u*0.7,u*1.64,u*0.2,u*0.08); ctx.fill();
  rr(cx-u*0.52,headY-u*1.5,u*1.04,u*0.9,u*0.12); ctx.fill();
  ctx.fillStyle='#8ba888'; rr(cx-u*0.52,headY-u*0.92,u*1.04,u*0.18,u*0.05); ctx.fill();
  ctx.restore();
}

// 얼굴 방울(강아지/여자): 사진을 글자로
function buildFaceInto(img,cx,cy,R,delayBase){
  if(!img) return;
  const cell=Math.max(3,Math.round((2*R)/60));   // 더 촘촘히 → 훨씬 선명
  const NY=Math.max(24,Math.round(2*R/cell));
  const NX=Math.max(16,Math.round(NY*img.width/img.height));
  const oc=document.createElement('canvas'); oc.width=NX; oc.height=NY;
  const o=oc.getContext('2d'); o.drawImage(img,0,0,NX,NY);
  const d=o.getImageData(0,0,NX,NY).data;
  const cw=NX*cell, ch=NY*cell, x0=cx-cw/2, y0=cy-ch/2;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){
    const idx=(j*NX+i)*4, r=d[idx],g=d[idx+1],b=d[idx+2];
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    const px=x0+(i+0.5)*cell, py=y0+(j+0.5)*cell;
    const dx=px-cx, dy=py-cy;
    if(dx*dx+dy*dy>R*R*0.98) continue;
    if(lum<0.10) continue;
    const ci=Math.max(0,Math.min(RAMP.length-1,Math.floor(lum*(RAMP.length-1))));
    const norm=(py-(cy-R))/(2*R);
    const delay=delayBase+norm*3200+Math.random()*2400;
    parts.push(makePart(px,py,RAMP[ci],
      Math.min(255,r*1.14+30),Math.min(255,g*1.12+28),Math.min(255,b*1.1+30),'face',delay,cell,false));
  }
}

// 맨 위 산타 모자(빨간 고깔 + 흰 띠 + 방울)
function buildSantaHat(){
  // 트리 꼭대기에 얹히는 빨간 고깔 + 흰 띠 + 흰 방울(살짝 오른쪽으로 기움)
  const bx=treeCX, by=treeTopY+treeHalf*0.52;      // 띠(브림)가 트리 꼭대기에 살짝 겹침
  const hatH=treeHalf*1.12, baseW=treeHalf*0.74;
  const tipX=bx+treeHalf*0.32, tipY=by-hatH;
  const dx=tipX-bx, dy=tipY-by, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, px=-uy, py=ux;
  // 빨간 고깔 (브림 바로 위부터 끝까지)
  const N=RM?70:150;
  for(let k=0;k<N;k++){
    const f=0.08+Math.pow(Math.random(),0.85)*0.92;
    const cxp=bx+dx*f, cyp=by+dy*f, w=baseW*(1-f)*0.5;
    const off=(Math.random()*2-1)*w;
    parts.push(makePart(cxp+px*off, cyp+py*off, pick("#%&8@Wx"),
      rnd(195,228),rnd(44,70),rnd(44,70),'hat',10300+Math.random()*1700,treeFs,false));
  }
  // 흰 띠 (브림): 트리 꼭대기에 가로로 도톰하게
  for(let k=0;k<(RM?34:78);k++){
    const a=Math.random()*6.2832, rx=baseW*0.62, ry=treeFs*1.0;
    parts.push(makePart(bx+Math.cos(a)*rx, by+Math.sin(a)*ry*rnd(0.55,1.0),
      pick("oO0*8%@"), rnd(228,247),rnd(230,247),rnd(234,251),'hat',10000+Math.random()*1000,treeFs,false));
  }
  // 끝 방울 (폼폼)
  for(let k=0;k<(RM?18:40);k++){
    const a=Math.random()*6.2832, rr=Math.random()*treeFs*1.35;
    parts.push(makePart(tipX+Math.cos(a)*rr, tipY+Math.sin(a)*rr, pick("oO0*8%"),
      rnd(232,251),rnd(232,251),rnd(238,253),'hat',11200+Math.random()*800,treeFs,false));
  }
}

function buildLights(){
  const turns=5, n=RM?40:70;
  for(let k=0;k<n;k++){
    const f=k/(n-1), t=0.12+f*0.84, y=treeTopY+(treeBaseY-treeTopY)*t;
    lights.push({ang:f*turns*6.2832, y, half:treeHalf*tierHalf(t)*0.88, hue:(k*47)%360, ph:Math.random()*6.28,
      delay:1400+(1-t)*2800+Math.random()*1400});
  }
}
function buildSnow(){ snow=[]; const n=RM?70:270;
  for(let k=0;k<n;k++){ const near=Math.random();    // 0 먼 눈 ~ 1 가까운 눈(원근 3겹 느낌)
    snow.push({x:Math.random()*W, y:Math.random()*H,
      r:rnd(0.6,1.1)+near*2.4, sp:rnd(9,22)*(0.5+near*1.6),
      dr:rnd(-14,14)*(0.5+near), ph:Math.random()*6.28, a:0.3+near*0.6}); } }
function buildBgStars(){ bgStars=[]; const n=Math.round(W*H/9000);
  for(let k=0;k<n;k++) bgStars.push({x:Math.random()*W,y:Math.random()*H*0.8,r:rnd(0.4,1.5),ph:Math.random()*6.28}); }

function buildScene(){
  parts=[]; lights=[]; orn=[];
  buildTree(); buildOrnaments(); buildLights();
  buildGifts(); buildSantaHat();   // 얼굴은 클레이 사진 구슬로 drawBaubles에서 직접 그림
}

function hsl(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l); const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]; }

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  computeLayout(); buildBgStars(); buildSnow();
  const was = started && elapsed>ASSEMBLE;
  buildScene();
  if(was || RM){ for(const p of parts){ if(p.kind!=='tree'){p.sx=p.tx;p.sy=p.ty;} } }
}

const easeOut=p=>1-Math.pow(1-p,3);
let lastFs=-1;

// 화면 탭 → 글자가 부서져 흩어졌다가 다시 생성
let burst=null;
const BURST_DUR=0.62, BURST_G=950;
function shatter(mx,my){
  if(burst || !started) return;
  const rot=elapsed/ROT_PERIOD*6.2832;
  for(const p of parts){
    let cx,cy;
    if(p.kind==='tree'){ cx=treeCX+Math.sin(p.ang+rot)*p.rad; cy=p.y; }
    else { cx=p.tx; cy=p.ty; }
    p.ex=cx; p.ey=cy;
    let dx=cx-mx, dy=cy-my, d=Math.hypot(dx,dy)||1;
    const sp=rnd(280,660);
    p.vx=(dx/d)*sp+rnd(-130,130);
    p.vy=(dy/d)*sp+rnd(-150,110)-rnd(40,170);
  }
  burst={t0:performance.now()};
}
function endBurst(ts){
  for(const p of parts){
    const ex=p.ex+p.vx*BURST_DUR, ey=p.ey+p.vy*BURST_DUR+0.5*BURST_G*BURST_DUR*BURST_DUR;
    p.sx=ex; p.sy=ey;
  }
  burst=null; t0=ts;                 // 전체 생성 순서를 처음부터 다시
}
function drawBurst(ts,tb){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fade=Math.max(0,1-tb/BURST_DUR);
  for(const p of parts){
    const x=p.ex+p.vx*tb, y=p.ey+p.vy*tb+0.5*BURST_G*tb*tb;
    if(p.fs!==lastFs){ ctx.font=p.fs+'px ui-monospace,Menlo,monospace'; lastFs=p.fs; }
    ctx.fillStyle='rgba('+(p.r|0)+','+(p.g|0)+','+(p.b|0)+','+(0.95*fade).toFixed(3)+')';
    ctx.fillText(p.ch,x,y);
  }
}
function drawParts(time,el,rot){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const p of parts){
    const lt=el-p.delay; if(lt<=0) continue;
    const pr=Math.min(1,lt/p.dur), e=easeOut(pr);
    let tx,ty,depthA=1;
    if(p.kind==='tree'){
      const cosv=Math.cos(p.ang+rot);
      tx=treeCX+Math.sin(p.ang+rot)*p.rad; ty=p.y;
      depthA=0.42+0.58*((cosv+1)/2);
    } else { tx=p.tx; ty=p.ty; }
    let x=p.sx+(tx-p.sx)*e, y=p.sy+(ty-p.sy)*e, a=pr;
    if(pr>=1){
      if(p.kind==='face') a=0.9+0.1*Math.sin(time*0.0035+p.ph);
      else if(p.kind==='hat') a=0.9+0.1*Math.sin(time*0.004+p.ph);
      else if(p.kind==='gift') a=0.92+0.08*Math.sin(time*0.004+p.ph);
      else a=(0.82+0.18*Math.sin(time*0.004+p.ph))*depthA;
    } else if(p.kind==='tree') a*=depthA;
    let cr=p.r, cg=p.g, cb=p.b;
    if(p.kind==='tree'){ const fl=Math.max(0,1-lt/340); if(fl>0){ cr+=(255-cr)*fl; cg+=(255-cg)*fl; cb+=(255-cb)*fl; } }
    if(p.fs!==lastFs){ ctx.font=p.fs+'px ui-monospace,Menlo,monospace'; lastFs=p.fs; }
    ctx.fillStyle='rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+','+a.toFixed(3)+')';
    ctx.fillText(p.ch,x,y);
  }
}

function drawOrnaments(time,el,rot){
  for(const o of orn){
    const lt=el-o.delay; if(lt<=0) continue;
    const cosv=Math.cos(o.ang+rot); if(cosv<-0.25) continue;
    const sc=easeOut(Math.min(1,lt/600));
    const x=treeCX+Math.sin(o.ang+rot)*o.half, y=o.y, R=o.size*sc;
    const front=0.45+0.55*((cosv+1)/2), c=hsl(o.hue,85,58);
    ctx.globalAlpha=front;
    ctx.shadowColor='hsl('+o.hue+',90%,55%)'; ctx.shadowBlur=7;

function drawSleighArt(x,y,dir,scale,ts){

  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(u*0.28,-u*1.2,u*0.06,0,6.2832); ctx.fill();
  ctx.restore();
  ctx.restore();

function drawSleigh(ts){

function noteHz(n){
  const m={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const name=n.slice(0,-1), oct=+n.slice(-1);
  return 440*Math.pow(2,((oct+1)*12+m[name]-69)/12);
}

function initAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.0001; master.connect(actx.destination);
    master.gain.setValueAtTime(0.0001,actx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.42,actx.currentTime+1.6);

function scheduler(){
  if(!actx || actx.state!=='running') return;
  while(nextTime<actx.currentTime+0.14){
    const [nm,b]=song.notes[seqIdx], dur=b*song.beat;
    if(nm) playNote(noteHz(nm),nextTime,dur);
    nextTime+=dur; seqIdx=(seqIdx+1)%song.notes.length;

function playNote(freq,time,dur){

  const sub=actx.createOscillator(); sub.type='sine'; sub.frequency.value=freq/2;
  const sg=actx.createGain(); sg.gain.value=0.0001; sub.connect(sg); sg.connect(master);
  const a=0.012, d=Math.min(0.14,dur*0.35);
  g.gain.setValueAtTime(0.0001,time);
  g.gain.exponentialRampToValueAtTime(0.85,time+a);
  g.gain.exponentialRampToValueAtTime(0.22,time+a+d);
  g.gain.setValueAtTime(0.22,time+dur*0.72);
  g.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.97);
  sg.gain.setValueAtTime(0.0001,time);
  sg.gain.exponentialRampToValueAtTime(0.2,time+a+0.03);
  sg.gain.exponentialRampToValueAtTime(0.0001,time+dur*0.9);
  o.start(time); o.stop(time+dur+0.02); sub.start(time); sub.stop(time+dur+0.02);
}

function hlLine(line){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let idx=line.indexOf('#'), code=idx>=0?line.slice(0,idx):line, com=idx>=0?line.slice(idx):'';
  code=esc(code);
  // 키워드 먼저(= span의 class= 속성과 충돌 방지) → 문자열 → 숫자
  code=code.replace(/\b(import|from|class|def|for|in|if|return|self|min|int|range|as|and|or|not|None|True|False)\b/g,'<b class="k">$1</b>');
  code=code.replace(/('[^']*')/g,'<b class="s">$1</b>');
  code=code.replace(/(^|[^\w.])(\d+\.?\d*)\b/g,'$1<b class="n">$2</b>');
  return code + (com?'<b class="c">'+esc(com)+'</b>':'');
}
(function buildCode(){
  const el=document.getElementById('code'); if(!el) return;
  const make=()=>CODE.map((ln,i)=>'<span class="ln">'+(i+1)+'</span>'+hlLine(ln)).join('\n');
  el.innerHTML=make()+'\n'+make();
})();
